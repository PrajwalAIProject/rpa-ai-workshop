// `tag` = the step of the agent loop each line shows; it also lights up the legend under the terminal.
const typingScript = [
  { tag:'GOAL',  cls:'cmd', text:'You › fix the failing test in payment_test.py' },
  { cls:'gap',  text:'' },
  { tag:'LOOK',  cls:'out', text:'Reading payment_test.py and payments.py…' },
  { tag:'THINK', cls:'out', text:'Found it: the total is a decimal, the test expects it rounded' },
  { tag:'ACT',   cls:'out', text:'Editing payments.py, line 42' },
  { tag:'CHECK', cls:'out', text:'Running the tests again…' },
  { tag:'CHECK', cls:'ok',  text:'✓ 12 passed, 0 failed: goal met' },
];
function lightLegend(tag){
  document.querySelectorAll('#codeLegend [data-step]').forEach(s => s.classList.toggle('on', s.dataset.step === tag));
}
const tagHtml = line => line.tag ? `<span class="term-tag">${line.tag}</span>` : '';

let typingToken = 0;
let activeTermId = null;
// Presenter override: open the deck with #animate to run the demos even when the laptop
// has Windows "Animation effects" turned off (which reports prefers-reduced-motion).
const forceMotion = /animate/i.test(location.hash);
if(forceMotion) document.documentElement.classList.add('force-motion');
const reducedMotion = !forceMotion && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// Typing #animate into the address bar of an open deck doesn't reload it, so reload when it changes.
window.addEventListener('hashchange', ()=>{ if(/animate/i.test(location.hash) !== forceMotion) location.reload(); });

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function startTypingDemo(elId, script){
  if(activeTermId === elId) return; // already running this one
  stopRpaVisual();
  const myToken = ++typingToken;
  activeTermId = elId;
  const el = document.getElementById(elId);
  if(!el) return;

  if(reducedMotion){
    el.innerHTML = script.map(renderLineFull).join('');
    return;
  }

  while(typingToken === myToken){
   try{
    el.innerHTML = '';
    for(const line of script){
      if(typingToken !== myToken) return;
      const lineEl = document.createElement('div');
      lineEl.className = 'term-line term-' + line.cls;
      el.appendChild(lineEl);
      if(line.cls === 'gap'){ await sleep(140); continue; }
      if(line.tag) lightLegend(line.tag);
      let typed = '';
      for(let i=0;i<line.text.length;i++){
        if(typingToken !== myToken) return;
        typed += line.text[i];
        lineEl.innerHTML = tagHtml(line) + escapeHtml(typed) + '<span class="caret">\u258b</span>';
        await sleep(line.cls==='cmd' ? 28 : 16);
      }
      lineEl.innerHTML = tagHtml(line) + escapeHtml(typed);
      await sleep(line.cls==='ok' ? 300 : (line.cls==='warn' ? 500 : 650)); // pause on each step so the room can follow
    }
    await sleep(2600);
    lightLegend(null);
    if(typingToken !== myToken) return;
   }catch(err){ console.error('typing demo error, restarting:', err); await sleep(1200); }
  }
}
function renderLineFull(line){
  return `<div class="term-line term-${line.cls}">${tagHtml(line)}${line.text ? escapeHtml(line.text) : '&nbsp;'}</div>`;
}
function stopTypingDemo(){ typingToken++; activeTermId = null; }

/* ============================= LIVE VISUAL AGENT DEMO (scrape + judge) ============================= */
// A made-up shop (".example" is reserved for examples): real sites such as Amazon block bots and forbid scraping.
const demoTaskPrompt = 'Search the shop for "wireless earbuds" and save the top 5 results (name, price, rating, reviews) as a CSV file.';
const DEMO_SITE = 'shop.example';

const demoProducts = [
  { name:'Wireless Earbuds Pro X2',   price:'\u20b91,299', rating:'4.2', reviews:'12,480', hasRating:true },
  { name:'SoundCore Mini Buds',       price:'\u20b91,799', rating:'4.0', reviews:'6,215',  hasRating:true },
  { name:'AudioMax Buds Lite',        price:'\u20b9899',   rating:'',    reviews:'',       hasRating:false },
  { name:'ClearTone Wireless Buds',   price:'\u20b91,199', rating:'3.8', reviews:'21,340', hasRating:true },
  { name:'BeatFlow Air Buds',         price:'\u20b91,499', rating:'4.3', reviews:'3,902',  hasRating:true },
];

let rpaToken = 0;
let rpaCardsBuilt = false;

function buildRpaCards(){
  if(rpaCardsBuilt) return;
  const container = document.getElementById('scanCards');
  if(!container) return;
  container.innerHTML = demoProducts.map((p,i)=>`
    <div class="scan-card" data-i="${i}">
      <span class="sc-check" id="scCheck${i}"><svg class="icn" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
      <div class="sc-thumb"><svg class="icn" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></div>
      <div class="sc-body">
        <div class="sc-top">${p.name}</div>
        <div class="sc-bottom"><span class="sc-price">${p.price}</span><span class="sc-rating ${p.hasRating?'':'sc-missing'}">${p.hasRating ? `\u2605 ${p.rating} (${p.reviews})` : 'No ratings yet'}</span></div>
      </div>
    </div>`).join('');
  rpaCardsBuilt = true;
}

async function startRpaVisual(){
  if(activeTermId === 'rpa-visual') return;
  stopTypingDemo();
  const myToken = ++rpaToken;
  activeTermId = 'rpa-visual';
  buildRpaCards();

  const promptEl   = document.getElementById('promptText');
  const statusEl   = document.getElementById('agentStatus');
  const spinnerEl  = document.getElementById('agentSpinner');
  const addrEl     = document.getElementById('addrText');
  const searchMock = document.getElementById('searchMock');
  const searchText = document.getElementById('searchText');
  const closedOv   = document.getElementById('closedOverlay');
  const outRows    = document.getElementById('outRows');
  const outFoot    = document.getElementById('outFooter');
  const footnote   = document.getElementById('outFootnote');
  const outputPanel= document.querySelector('.output-panel');
  const phaseEl    = document.getElementById('agentPhase');
  const cmpStrip   = document.getElementById('cmpStrip');
  const cards = () => Array.from(document.querySelectorAll('.scan-card'));
  if(!statusEl) return;

  const alive = () => rpaToken === myToken;
  // `phase` = the agent-loop step shown in the chip: GOAL / THINK / ACT / LOOK / CHECK
  const setStatus = (t, spinning, phase) => {
    statusEl.textContent = t; spinnerEl.classList.toggle('on', !!spinning);
    if(phaseEl){ phaseEl.textContent = phase || ''; phaseEl.classList.toggle('on', !!phase); }
  };
  const typeInto = async (el, text, ms) => { for(const ch of text){ if(!alive()) return; el.textContent += ch; await sleep(ms); } };

  if(reducedMotion){
    promptEl.textContent = demoTaskPrompt;
    addrEl.textContent = DEMO_SITE + '/search?q=wireless+earbuds';
    cards().forEach((c,i)=>{ c.classList.add('shown'); const chk=document.getElementById('scCheck'+i); chk.classList.add('show'); if(!demoProducts[i].hasRating) chk.classList.add('flag'); });
    setStatus('\u2713 Checked: 5 rows saved to search_results.csv, 1 decision logged', false, 'CHECK');
    outRows.innerHTML = demoProducts.map(p=>`<tr class="out-row show"><td>${p.name}</td><td>${p.price}</td><td class="${p.hasRating?'':'out-judgment'}">${p.hasRating?p.rating:'new listing*'}</td><td class="${p.hasRating?'':'out-judgment'}">${p.hasRating?p.reviews:'\u2014'}</td></tr>`).join('');
    footnote.classList.add('show'); outputPanel.classList.add('done');
    if(cmpStrip) cmpStrip.classList.add('show');
    return;
  }

  while(alive()){
   try{
    // ---- reset everything for a clean loop ----
    promptEl.textContent=''; addrEl.textContent=''; searchText.textContent='';
    searchMock.classList.remove('shown'); closedOv.classList.remove('show');
    outRows.innerHTML=''; outFoot.textContent=''; footnote.classList.remove('show');
    outputPanel.classList.remove('done');
    if(cmpStrip) cmpStrip.classList.remove('show');
    cards().forEach((c,i)=>{ c.classList.remove('shown','scanning'); document.getElementById('scCheck'+i).classList.remove('show','flag'); });
    document.querySelectorAll('.sc-callout').forEach(c=>c.remove()); // left behind if the slide was exited mid-callout

    // ---- phase 1: the goal ----
    setStatus('Waiting for a goal', false);
    await typeInto(promptEl, demoTaskPrompt, 14); if(!alive()) return;
    setStatus('Goal received', false, 'GOAL');
    await sleep(900); if(!alive()) return;

    // ---- phase 2: plan ----
    setStatus('Planning: open the shop, search, read 5 listings, save a table\u2026', true, 'THINK');
    await sleep(1600); if(!alive()) return;

    // ---- phase 3: navigate ----
    setStatus(`Opening ${DEMO_SITE}\u2026`, true, 'ACT');
    await typeInto(addrEl, DEMO_SITE, 24); if(!alive()) return;
    await sleep(400); if(!alive()) return;

    setStatus('Typing the search\u2026', true, 'ACT');
    searchMock.classList.add('shown');
    await sleep(200); if(!alive()) return;
    await typeInto(searchText, 'wireless earbuds', 32); if(!alive()) return;
    await sleep(350); if(!alive()) return;

    setStatus('Searching\u2026', true, 'ACT');
    addrEl.textContent = '';
    await typeInto(addrEl, DEMO_SITE + '/search?q=wireless+earbuds', 10); if(!alive()) return;
    await sleep(300); if(!alive()) return;
    searchMock.classList.remove('shown');

    // ---- phase 4: results load ----
    setStatus('Results loaded \u2014 reading the listings\u2026', true, 'LOOK');
    cards().forEach((c,i)=> setTimeout(()=>{ if(alive()) c.classList.add('shown'); }, i*90));
    await sleep(700); if(!alive()) return;

    // ---- phase 5: collect (checkmarks only, table stays empty) ----
    for(let i=0;i<demoProducts.length;i++){
      if(!alive()) return;
      const p = demoProducts[i];
      const cardEl = cards()[i];
      cards().forEach(c=>c.classList.remove('scanning'));
      cardEl.classList.add('scanning');
      setStatus(`Reading listing ${i+1} of ${demoProducts.length}\u2026`, true, 'LOOK');
      await sleep(550); if(!alive()) return;

      if(!p.hasRating){
        // The key moment of the demo: a surprise the steps did not plan for. Hold it long enough to talk about it.
        setStatus(`Listing ${i+1} has no rating. Deciding what to do\u2026`, true, 'THINK');
        const callout = document.createElement('div');
        callout.className = 'sc-callout';
        callout.textContent = 'No rating yet: keep it as a "new listing" and note why (don\u2019t drop it)';
        cardEl.appendChild(callout);
        requestAnimationFrame(()=> requestAnimationFrame(()=> callout.classList.add('show')));
        if(cmpStrip) cmpStrip.classList.add('show');
        await sleep(3200); if(!alive()) return;
        callout.classList.remove('show');
        setTimeout(()=> callout.remove(), 350);
      }

      { const chk = document.getElementById('scCheck'+i); chk.classList.add('show'); if(!p.hasRating) chk.classList.add('flag'); }
      cardEl.classList.remove('scanning');
      await sleep(350); if(!alive()) return;
    }

    // ---- phase 6: close the browser ----
    setStatus('Closing the browser\u2026', true, 'ACT');
    await sleep(500); if(!alive()) return;
    closedOv.classList.add('show');
    await sleep(1100); if(!alive()) return;

    // ---- phase 7: build the table from what it collected ----
    setStatus('Writing the table\u2026', true, 'ACT');
    await sleep(500); if(!alive()) return;
    for(let i=0;i<demoProducts.length;i++){
      if(!alive()) return;
      const p = demoProducts[i];
      const tr = document.createElement('tr');
      tr.className = 'out-row';
      tr.innerHTML = `<td>${p.name}</td><td>${p.price}</td><td class="${p.hasRating?'':'out-judgment'}">${p.hasRating ? p.rating : 'new listing*'}</td><td class="${p.hasRating?'':'out-judgment'}">${p.hasRating ? p.reviews : '\u2014'}</td>`;
      outRows.appendChild(tr);
      requestAnimationFrame(()=> requestAnimationFrame(()=> tr.classList.add('show')));
      if(!p.hasRating) footnote.classList.add('show');
      await sleep(260); if(!alive()) return;
    }

    setStatus('\u2713 Checked: 5 rows saved to search_results.csv, 1 decision logged', false, 'CHECK');
    outFoot.textContent = '\u2713 5 rows \u00b7 4 columns \u00b7 goal met';
    outputPanel.classList.add('done');
    await sleep(3400); if(!alive()) return;
   }catch(err){ console.error('RPA visual demo error, restarting:', err); await sleep(1200); }
  }
}

/* ============================= INTERACTIVE SLIDES ============================= */
// A slide with `interactive:'name'` has buttons in its HTML; INTERACTIONS[name](el) wires them (el = its .slide-inner)
// the first time the slide is shown and returns a reset function. The engine calls reset when the
// presenter leaves the slide, so it looks untouched next time (and in print/screenshots).
function timers(){
  let ids = [];
  return {
    later(fn, ms){ ids.push(setTimeout(fn, reducedMotion ? 0 : ms)); }, // reduced motion: jump to the end state
    clear(){ ids.forEach(clearTimeout); ids = []; },
  };
}
function onClick(btn, fn){ if(btn) btn.addEventListener('click', ()=>{ btn.blur(); fn(btn); }); }

const INTERACTIONS = {
  // Slide "AI vs agentic AI": the same request; the AI replies with advice, the agent works through its loop.
  agent(el){
    const t = timers(), lines = [...el.querySelectorAll('.bb span, .log span, .res')];
    const reset = ()=>{ t.clear(); el.classList.remove('s10-play'); lines.forEach(x => x.classList.remove('on')); };
    onClick(el.querySelector('[data-act="job"]'), ()=>{
      reset(); el.classList.add('s10-play');
      const ai = [...el.querySelectorAll('.bb span')], log = [...el.querySelectorAll('.log span')], [resAi, resAgent] = el.querySelectorAll('.res');
      ai.forEach((x, i) => t.later(()=> x.classList.add('on'), 300 + i*450));
      t.later(()=> resAi.classList.add('on'), 300 + ai.length*450);
      log.forEach((x, i) => t.later(()=> x.classList.add('on'), 600 + i*800));
      t.later(()=> resAgent.classList.add('on'), 600 + log.length*800);
    });
    return reset;
  },

  // Slide "AI vs. RPA": a new invoice layout breaks the fixed-spot bot; the AI still understands.
  layout(el){
    const reset = ()=> el.classList.remove('s07-new');
    onClick(el.querySelector('[data-act="layout"]'), btn => {
      const on = el.classList.toggle('s07-new');
      btn.textContent = on ? '↺ Back to the old layout' : '⚡ Change the layout';
    });
    return ()=>{ reset(); el.querySelector('[data-act="layout"]').textContent = '⚡ Change the layout'; };
  },

  // Slide "AI: movies vs reality": the button stamps the myths and reveals the real-AI chat (click again to hide).
  punch(el){
    const real = el.querySelector('.s04b-real');
    const reset = ()=>{ el.classList.remove('s04b-on'); real.hidden = true; };
    onClick(el.querySelector('[data-act="reality"]'), ()=>{ const on = !el.classList.contains('s04b-on'); el.classList.toggle('s04b-on', on); real.hidden = !on; });
    return reset;
  },

  // Slide "Question: what is AI?": the browser's speech recognition listens to the room and
  // builds a word cloud. Needs Chrome/Edge with internet; the type-a-word box always works.
  listen(el){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const mic = el.querySelector('[data-act="listen"]'), status = el.querySelector('.s04-status');
    const heard = el.querySelector('.s04-heard'), cloud = el.querySelector('.s04-cloud');
    const aha = el.querySelector('.s04-aha'), type = el.querySelector('.s04-type');
    const STOP = new Set('a an the is it its i im me my we you your and or of to in on for with that this so um uh like just ai artificial intelligence'.split(' '));
    const counts = new Map();
    let rec = null, on = false;
    const say = t => status.textContent = t;
    function addWords(text, spoken){
      text.toLowerCase().replace(/[^a-z0-9\s'-]/g, ' ').split(/\s+/).filter(w => w.length > 1 && !STOP.has(w)).forEach(w => {
        counts.set(w, (counts.get(w) || 0) + 1);
        let chip = [...cloud.children].find(c => c.dataset.w === w);
        if(!chip){ cloud.querySelector('.s04-empty')?.remove(); chip = document.createElement('span'); chip.className = 's04-w'; chip.dataset.w = w; chip.textContent = w; cloud.append(chip); }
        else { chip.style.animation = 'none'; void chip.offsetWidth; chip.style.animation = ''; }
        chip.style.setProperty('--n', Math.min(counts.get(w), 5));
      });
      if(spoken && counts.size) aha.hidden = false; // the punchline is about voices, so only after the mic heard something
    }
    function stop(){
      on = false; el.classList.remove('s04-on');
      mic.setAttribute('aria-pressed', 'false'); mic.setAttribute('aria-label', 'Start listening');
      if(rec) try{ rec.stop(); }catch(e){}
      if(status.textContent === 'Listening…') say('Tap to listen');
    }
    function start(){
      if(!SR){ say('Use Chrome or Edge to listen'); type.focus(); return; }
      if(!rec){
        rec = new SR(); rec.lang = 'en-IN'; rec.continuous = true; rec.interimResults = true;
        rec.onresult = e => {
          let interim = '';
          for(let i = e.resultIndex; i < e.results.length; i++){
            const t = e.results[i][0].transcript;
            if(e.results[i].isFinal){ addWords(t, true); heard.innerHTML = 'heard: <b>' + escapeHtml(t.trim()) + '</b>'; }
            else interim += t;
          }
          if(interim) heard.innerHTML = 'hearing: <b>' + escapeHtml(interim.trim()) + '</b>…';
        };
        rec.onerror = e => {
          const why = { 'not-allowed':'Mic blocked: type instead', 'service-not-allowed':'Mic blocked: type instead', 'network':'Needs internet: type instead', 'audio-capture':'No microphone found' }[e.error];
          if(why){ stop(); say(why); }
        };
        rec.onend = () => { if(on) try{ rec.start(); }catch(e){} }; // Chrome stops after a pause; keep listening
      }
      on = true; el.classList.add('s04-on');
      mic.setAttribute('aria-pressed', 'true'); mic.setAttribute('aria-label', 'Stop listening');
      say('Listening…');
      try{ rec.start(); }catch(e){}
    }
    mic.addEventListener('click', ()=>{ mic.blur(); on ? stop() : start(); });
    type.addEventListener('keydown', e => {
      if(e.key === 'Enter' && type.value.trim()){ addWords(type.value); heard.innerHTML = 'typed: <b>' + escapeHtml(type.value.trim()) + '</b>'; type.value = ''; }
      if(e.key === 'Escape') type.blur();
    });
    return stop; // leaving the slide turns the mic off; the words stay
  },

  // Slide "How an LLM works": the sentence grows one word at a time; at each step the top
  // three guesses grow as bars and the winner is added. "unknown" ends in a hallucination.
  llm(el){
    const t = timers(), prompt = el.querySelector('.s06-prompt');
    const gen = el.querySelector('.s06-gen'), rows = [...el.querySelectorAll('.s06-c')], stepName = el.querySelector('.s06-stepname');
    const ok = el.querySelector('.s06-msg--ok'), warn = el.querySelector('.s06-msg--warn');
    const RUNS = {
      write:   { prompt:'The capital of India is', end:ok,
                 steps:[[['New',92],['Delhi',4],['a',2]], [['Delhi',97],['York',1],['Jersey',1]], [['.',78],[',',15],['and',5]]] },
      unknown: { prompt:'The IPL 2027 winner will be', end:warn, bad:true,
                 steps:[[['RCB',31],['CSK',29],['MI',27]], [['.',80],['!',12],['again',5]]] },
    };
    const staticHtml = { prompt: prompt.textContent, rows: rows.map(r => r.innerHTML), pick: rows.map(r => r.classList.contains('s06-c--pick')) };
    const show = (cands, widths) => rows.forEach((r, i) => {
      r.classList.remove('s06-c--pick');
      r.querySelector('.s06-w').textContent = cands[i][0] === '.' ? '. (end)' : cands[i][0] === ',' ? ', (comma)' : cands[i][0];
      r.querySelector('.s06-bar').style.width = widths ? cands[i][1] + '%' : '0';
      r.querySelector('.s06-p').textContent = cands[i][1] + '%';
    });
    function reset(){
      t.clear(); el.classList.remove('s06-think', 's06-bad');
      prompt.textContent = staticHtml.prompt; gen.innerHTML = '';
      rows.forEach((r, i) => { r.innerHTML = staticHtml.rows[i]; r.classList.toggle('s06-c--pick', staticHtml.pick[i]); });
      stepName.textContent = '3 · Its top guesses'; ok.hidden = true; warn.hidden = true;
    }
    function play(name){
      reset();
      const run = RUNS[name];
      prompt.textContent = run.prompt; el.classList.toggle('s06-bad', !!run.bad);
      let at = 200;
      run.steps.forEach((cands, k) => {
        t.later(()=>{ el.classList.add('s06-think'); stepName.textContent = '3 · Guesses for word ' + (k + 1); show(cands, false); }, at);
        t.later(()=> show(cands, true), at + 120);
        t.later(()=>{ el.classList.remove('s06-think'); rows[0].classList.add('s06-c--pick'); }, at + 1000);
        t.later(()=>{ const w = cands[0][0], b = document.createElement('b'); b.textContent = w; const punct = /^[.,!]$/.test(w); if(punct) b.className = 'p'; gen.append(punct ? '' : ' ', b); }, at + 1500);
        at += 2300;
      });
      t.later(()=>{ run.end.hidden = false; }, at);
    }
    onClick(el.querySelector('[data-act="write"]'), ()=> play('write'));
    onClick(el.querySelector('[data-act="unknown"]'), ()=> play('unknown'));
    return reset;
  },

  // Slide "The agent loop": an agent does the invoice job on a mock screen. The run is a list of
  // snapshots; render(i) draws snapshot i from scratch, so Play, Step and reset share one path.
  loop(el){
    const t = timers(), say = el.querySelector('.s11-say'), cursor = el.querySelector('.s11-cursor');
    const mails = [...el.querySelectorAll('.s11-mail')], cks = [...el.querySelectorAll('.s11-ck')];
    const apps = { inbox: el.querySelector('.s11-inbox'), doc: el.querySelector('.s11-doc'), xl: el.querySelector('.s11-xl') };
    const docHead = el.querySelector('.s11-dh'), docEmpty = el.querySelector('.s11-empty'), tbody = el.querySelector('tbody');
    const playBtn = el.querySelector('[data-act="play"]'), stepBtn = el.querySelector('[data-act="step"]');
    const INV = [
      { mail:0, no:'INV-2291', vendor:'Acme Supplies', total:'48,500' },
      { mail:2, no:'INV-2292', vendor:'Zen Foods', total:'12,300' },
      { mail:3, no:null, vendor:'Ravi Traders', total:'9,800' },
    ];
    // Build the snapshots. Each one is the whole state of the screen after that step.
    const S = [];
    let st = { phase:null, exit:null, focus:null, tagged:0, cur:null, done:[], sent:[], doc:null, checks:0, rows:0, verify:-1 };
    const add = (say, patch) => { st = Object.assign({}, st, patch, { say }); S.push(st); };
    add('<b>GOAL</b> Every new invoice must be in the Excel tracker. Nobody told it which clicks to make.', { phase:null });
    add('<b>LOOK</b> It reads the inbox and sorts every email: invoice or not?', { phase:'LOOK', focus:'inbox', tagged:4 });
    INV.forEach((v, k) => {
      if(k > 0) add('<b>LOOK</b> Back to the inbox: the next invoice is from ' + v.vendor + '.', { phase:'LOOK', focus:'inbox', cur:v.mail, doc:null, checks:0, verify:-1 });
      else add('<b>LOOK</b> 3 invoices and 1 lunch email (ignored). It starts with ' + v.vendor + '.', { phase:'LOOK', focus:'inbox', cur:v.mail });
      add('<b>THINK</b> It opens the invoice and checks what it expects: an invoice number, a vendor and a total.', { phase:'THINK', focus:'doc', doc:k, checks:3 });
      if(v.no){
        add('<b>ACT</b> All three are there, so it uses a tool: it opens Excel and adds the row.', { phase:'ACT', focus:'xl', rows:st.rows + 1 });
        add('<b>CHECK</b> It reads the row back: it matches the invoice ✓' + (k < 2 ? ' Not done yet, so round the loop again.' : ''), { phase:'CHECK', focus:'xl', verify:st.rows - 1, done:st.done.concat(v.mail) });
      } else {
        add('<b>THINK</b> No invoice number! Guessing one is risky, so it will not act on this one.', { phase:'THINK', focus:'doc' });
        add('<b>ASK</b> It stops and sends this invoice to a person, with a note saying why.', { phase:null, exit:'ask', focus:'inbox', sent:[v.mail], doc:k });
      }
    });
    add('<b>DONE</b> 2 invoices added, 1 sent to you, and a short report. The goal is met as far as it is safe.', { phase:null, exit:'done', focus:null, cur:null, verify:-1 });

    const field = (k, ok, label, val, why) => { const c = cks[k]; c.className = 's11-ck on ' + (ok ? 'ok' : 'bad'); c.querySelector('i').textContent = ok ? '✓' : '✗'; c.querySelector('span').textContent = label + ': ' + val; c.querySelector('small').textContent = why || ''; };
    const moveTo = target => { if(!target) return; const box = el.querySelector('.s11-scr').getBoundingClientRect(), r = target.getBoundingClientRect(); cursor.style.left = (r.left - box.left + r.width * .7) + 'px'; cursor.style.top = (r.top - box.top + r.height * .45) + 'px'; };
    let i = -1;
    function render(n){
      i = n; const x = S[n];
      el.querySelectorAll('.s11-n').forEach(p => p.classList.toggle('on', !!x && p.dataset.n === x.phase));
      el.querySelector('.s11-x--done').classList.toggle('on', !!x && x.exit === 'done');
      el.querySelector('.s11-x--ask').classList.toggle('on', !!x && (x.exit === 'ask' || (x.exit === 'done' && x.sent.length > 0)));
      Object.entries(apps).forEach(([k, a]) => a.classList.toggle('focus', !!x && x.focus === k));
      mails.forEach((m, k) => {
        const inv = INV.some(v => v.mail === k);
        m.className = 's11-mail' + (x && k < x.tagged ? ' tag ' + (inv ? 'inv' : 'skip') : '') + (x && x.cur === k ? ' cur' : '') + (x && x.done.includes(k) ? ' done' : '') + (x && x.sent.includes(k) ? ' sent' : '');
      });
      const d = x && x.doc !== null ? INV[x.doc] : null;
      docEmpty.hidden = !!d; docHead.hidden = !d; cks.forEach(c => c.className = 's11-ck');
      if(d){
        docHead.textContent = d.vendor;
        if(x.checks > 0) field(0, !!d.no, 'Invoice no.', d.no || 'missing', d.no ? '' : 'expected!');
        if(x.checks > 1) field(1, true, 'Vendor', d.vendor);
        if(x.checks > 2) field(2, true, 'Total', '₹' + d.total);
      }
      const rows = x ? INV.filter(v => v.no).slice(0, x.rows) : [];
      tbody.innerHTML = rows.map((v, k) => '<tr class="' + (k === x.rows - 1 && x.phase === 'ACT' ? 'new' : '') + (k === x.verify ? ' verify' : '') + '"><td>' + v.no + '</td><td>' + v.vendor + '</td><td>' + v.total + '</td></tr>').join('');
      say.innerHTML = x ? x.say : 'Press <b>Play</b> or <b>Step</b> to watch the agent do the invoice job.';
      if(x) moveTo(x.focus === 'inbox' ? mails[x.cur ?? 0] : x.focus === 'doc' ? cks[0] : x.focus === 'xl' ? (tbody.lastElementChild || el.querySelector('.s11-xl table')) : null);
      stepBtn.textContent = n >= S.length - 1 ? '↺ Start again' : 'Step ›';
    }
    function reset(){ t.clear(); playBtn.textContent = '▶ Play'; render(-1); }
    onClick(stepBtn, ()=>{ t.clear(); playBtn.textContent = '▶ Play'; render(i >= S.length - 1 ? -1 : i + 1); });
    onClick(playBtn, ()=>{
      if(playBtn.textContent.startsWith('❚❚')){ t.clear(); playBtn.textContent = '▶ Play'; return; }
      if(i >= S.length - 1) render(-1);
      playBtn.textContent = '❚❚ Pause';
      for(let k = i + 1, n = 0; k < S.length; k++, n++) t.later(()=>{ render(k); if(k === S.length - 1) playBtn.textContent = '▶ Play'; }, 300 + n * 1700);
    });
    render(-1);
    return reset;
  },

  // Slide "One invoice, three ways": the same surprise hits all three lanes at once.
  surprise(el){
    const t = timers(), lanes = [...el.querySelectorAll('.s20-lane')], name = el.querySelector('.s20-sname');
    const who = lanes.map(l => l.querySelector('.s20-who')), whoHtml = who.map(w => w.innerHTML);
    // each lane: [result, does the job stop there?, line 1, line 2]
    const SURPRISES = [
      { name:'A new vendor sends a new invoice layout', hit:1, band:-1, lanes:[
        ['bad', true,  '✗ Bot stops.', 'You type it in.'],
        ['ok',  false, '✓ AI reads it.', 'Straight to Excel.'],
        ['ok',  false, '✓ Agent reads it.', 'It carries on.']] },
      { name:'Excel is slow and times out', hit:2, band:0, lanes:[
        ['bad',   true,  '✗ Bot stops.', 'You rerun it.'],
        ['bad',   true,  '✗ Bot stops.', 'You rerun it.'],
        ['retry', false, '✓ Agent retries.', 'Works the 2nd time.']] },
      { name:'Ravi Traders’ invoice has no number', hit:1, band:1, lanes:[
        ['bad',  true, '✗ Bot stops.', 'You chase the vendor.'],
        ['warn', true, '! AI is not sure.', 'You check the field.'],
        ['warn', true, '! Agent asks you,', 'and says why.']] },
      { name:'This invoice was already paid', hit:2, band:2, lanes:[
        ['bad',  false, '✗ No rule for it.', 'Added twice.'],
        ['bad',  false, '✗ AI read it fine.', 'Still added twice.'],
        ['skip', false, '✓ Agent checks the tracker.', 'It skips it.']] },
    ];
    // Scoreboard: how many surprises each row handled without a person (asking a person on a risky one is still correct).
    const scores = lanes.map(l => l.querySelector('.s20-score')), ALONE = ['ok', 'retry', 'skip'];
    let next = 0, played = 0, alone = [0, 0, 0];
    const showScores = ()=> scores.forEach((sc, i) => { sc.hidden = !played; sc.textContent = `alone: ${alone[i]}/${played}`; });
    function clean(){
      t.clear();
      lanes.forEach((l, i)=>{
        l.classList.remove('s20-play');
        l.querySelectorAll('.s20-st, .s20-band span').forEach(s => s.classList.remove('p-on','p-bad','p-warn','p-ok','p-skip','p-hit'));
        who[i].innerHTML = whoHtml[i];
      });
    }
    function reset(){ clean(); next = 0; played = 0; alone = [0, 0, 0]; showScores(); name.textContent = ''; name.hidden = true; }
    onClick(el.querySelector('[data-act="surprise"]'), ()=>{
      clean();
      if(next === 0){ played = 0; alone = [0, 0, 0]; showScores(); } // a new round of four starts the score again
      const s = SURPRISES[next]; next = (next + 1) % SURPRISES.length;
      const last = next === 0;
      name.hidden = false; name.textContent = `${SURPRISES.indexOf(s)+1} of ${SURPRISES.length}: ${s.name}`;
      lanes.forEach((lane, li)=>{
        const [res, stops, l1, l2] = s.lanes[li], steps = [...lane.querySelectorAll('.s20-st')];
        lane.classList.add('s20-play');
        steps.forEach((st, k)=>{
          if(k > s.hit && stops) return;
          t.later(()=>{
            if(k !== s.hit) return st.classList.add('p-on');
            if(res === 'retry'){ st.classList.add('p-bad'); t.later(()=>{ st.classList.remove('p-bad'); st.classList.add('p-ok'); }, 700); }
            else st.classList.add('p-' + res);
            const chip = lane.querySelectorAll('.s20-band span')[s.band];
            if(chip) chip.classList.add('p-hit');
          }, 250 + k*450);
        });
        t.later(()=>{ who[li].innerHTML = `<span class="s20-res s20-res--${res}"><b>${escapeHtml(l1)}</b>${escapeHtml(l2)}</span>`; }, 250 + 4*450 + 500);
      });
      t.later(()=>{
        played++; s.lanes.forEach(([res], li) => { if(ALONE.includes(res)) alone[li]++; }); showScores();
        if(last) name.textContent = `All 4 done ✓ C asked you only about the risky one`;
      }, 250 + 4*450 + 600);
    });
    reset();
    return reset;
  },

  // Slide "Works today vs hype": the room votes on each statement, then it appears in its column.
  quiz(el){
    const card = el.querySelector('.s23-quiz'), items = [...el.querySelectorAll('.s23-col li')];
    const COLS = { go:'Works today', watch:'Works with a person watching', hype:'Still hype' };
    const catOf = li => ['go','watch','hype'].find(c => li.closest('.s23-' + c));
    const $ = sel => card.querySelector(sel);
    const votes = [...card.querySelectorAll('[data-v]')], nextBtn = $('[data-act="next"]');
    let order = [], qi = 0, score = 0;
    function reset(){
      el.classList.remove('s23-quizzing'); card.hidden = true;
      items.forEach(li => li.classList.remove('q-hide','q-flash'));
    }
    function show(){
      const li = order[qi], text = li.textContent.trim();
      $('.s23-qn').textContent = `${qi+1} of ${order.length}`;
      $('.s23-qs').textContent = text.startsWith('“') ? text : `“${text}”`;
      $('.s23-qfb').textContent = ''; $('.s23-qfb').className = 's23-qfb';
      votes.forEach(v => { v.hidden = false; v.disabled = false; });
      nextBtn.hidden = true;
    }
    function finish(){
      $('.s23-qn').textContent = 'Done';
      $('.s23-qs').textContent = `The room got ${score} of ${order.length} right.`;
      $('.s23-qfb').textContent = '';
      votes.forEach(v => v.hidden = true);
      nextBtn.hidden = true;
    }
    onClick(el.querySelector('[data-act="quiz"]'), ()=>{
      reset();
      order = items.slice().sort(()=> Math.random() - .5); qi = 0; score = 0;
      items.forEach(li => li.classList.add('q-hide'));
      el.classList.add('s23-quizzing'); card.hidden = false;
      show();
    });
    votes.forEach(v => onClick(v, ()=>{
      const li = order[qi], cat = catOf(li), right = v.dataset.v === cat;
      if(right) score++;
      li.classList.remove('q-hide'); li.classList.add('q-flash');
      const fb = $('.s23-qfb');
      fb.textContent = right ? '✓ The room is right!' : `✗ Not quite: it is “${COLS[cat]}”`;
      fb.className = 's23-qfb ' + (right ? 'ok' : 'bad');
      votes.forEach(x => x.disabled = true);
      nextBtn.hidden = false;
      nextBtn.textContent = qi + 1 < order.length ? 'Next ›' : 'See the score';
    }));
    onClick(nextBtn, ()=>{ qi++; if(qi < order.length) show(); else finish(); });
    onClick($('[data-act="end"]'), reset);
    return reset;
  },
};

const interactiveResets = {};
let interactiveOn = null;
function wireInteractive(){
  if(interactiveOn !== null && interactiveOn !== current){ interactiveResets[interactiveOn](); interactiveOn = null; }
  const name = slides[current].interactive;
  if(!name || !INTERACTIONS[name]) return;
  if(!interactiveResets[current]) interactiveResets[current] = INTERACTIONS[name](slideEls[current].querySelector(".slide-inner"));
  interactiveOn = current;
}

/* ============================= PRESENTER TOOLS: OVERVIEW (O) AND TALK TIMER (T) ============================= */
const overview = document.getElementById('overview');
function toggleOverview(){
  if(!overview.hidden){ overview.hidden = true; return; }
  overview.innerHTML = `<h3>All ${total} slides</h3>
    <p class="ov-keys">Click a slide to jump to it. <kbd>O</kbd> or <kbd>Esc</kbd> closes. &nbsp; <kbd>N</kbd> notes · <kbd>T</kbd> talk timer (<kbd>Shift</kbd>+<kbd>T</kbd> restarts it) · <kbd>F</kbd> full screen</p>
    <div class="ov-grid">` + slides.map((s,i)=>`<button type="button" data-i="${i}"${i===current?' class="now" aria-current="true"':''}><b>${String(i+1).padStart(2,'0')}</b><span>${escapeHtml(s.label)}${s.interactive?'<i>▶ interactive</i>':''}</span></button>`).join('') + '</div>';
  overview.hidden = false;
  overview.querySelector('.now').focus();
}
overview.addEventListener('click', e=>{
  const b = e.target.closest('button[data-i]');
  if(b){ overview.hidden = true; goTo(+b.dataset.i); }
});

// The talk is planned for 60 minutes: the pill turns amber with 5 minutes left and red when time is up.
const TALK_MINUTES = 60, talkTimer = document.getElementById('talkTimer');
let talkStart = null;
function tickTimer(){
  const s = Math.floor((Date.now() - talkStart) / 1000), m = Math.floor(s / 60);
  talkTimer.innerHTML = `⏱ ${m}:${String(s % 60).padStart(2,'0')} <span>of ${TALK_MINUTES}:00 · slide ${current+1}/${total}</span>`;
  talkTimer.classList.toggle('late', m >= TALK_MINUTES - 5 && m < TALK_MINUTES);
  talkTimer.classList.toggle('over', m >= TALK_MINUTES);
}
function toggleTimer(restart){
  if(talkStart === null){ talkStart = Date.now(); setInterval(tickTimer, 1000); }
  if(restart){ talkStart = Date.now(); talkTimer.hidden = false; }
  else talkTimer.hidden = !talkTimer.hidden;
  tickTimer();
}

layout();

/* ============================= TILT (desktop only) ============================= */
if(window.matchMedia('(hover: hover)').matches){
  document.addEventListener('mousemove', (e)=>{
    document.querySelectorAll('.slide.in-view .tilt').forEach(el=>{
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dx = (e.clientX - cx)/r.width, dy = (e.clientY - cy)/r.height;
      if(Math.abs(dx) < 2 && Math.abs(dy) < 2){
        el.style.transform = `perspective(700px) rotateX(${dy*-6}deg) rotateY(${dx*6}deg)`;
      }
    });
  });
}

/* ============================= BACKGROUND PARTICLE NETWORK ============================= */
(function(){
  const canvas = document.getElementById('bgfx');
  const ctx = canvas.getContext('2d');
  const reduced = reducedMotion;
  let w,h,points;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function init(){
    resize();
    const count = Math.min(70, Math.floor((w*h)/22000));
    points = Array.from({length:count}, ()=>({
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-0.5)*0.25, vy:(Math.random()-0.5)*0.25
    }));
  }
  function step(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#05070D';
    ctx.fillRect(0,0,w,h);
    points.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
    });
    for(let i=0;i<points.length;i++){
      for(let j=i+1;j<points.length;j++){
        const dx=points[i].x-points[j].x, dy=points[i].y-points[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<130){
          ctx.strokeStyle = `rgba(23,179,169,${0.14*(1-dist/130)})`;
          ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(points[i].x,points[i].y); ctx.lineTo(points[j].x,points[j].y); ctx.stroke();
        }
      }
    }
    points.forEach(p=>{
      ctx.fillStyle='rgba(23,179,169,0.55)';
      ctx.beginPath(); ctx.arc(p.x,p.y,1.6,0,Math.PI*2); ctx.fill();
    });
    if(!reduced) requestAnimationFrame(step);
  }
  window.addEventListener('resize', resize);
  init();
  step();
})();
</script>
