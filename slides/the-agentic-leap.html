<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI & RPA: From StudioX to Agentic Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without blocking the page; offline, the deck falls back to system fonts. No other external dependencies. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --ink:#0F1222; --slate:#223047; --teal:#17B3A9; --teal-deep:#0A5C64;
    --amber:#F2B134; --paper:#FDFDFD; --mist:#F1F5F8; --muted:#64748B;
    --line:#E2E8F0; --mint:#CFEEEA;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{font-family:'Sora',system-ui,sans-serif;}
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){ body{background:#05070D;} }
  }

  #bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

  #viewport{
    position:fixed; inset:0; z-index:1;
    perspective:1800px; overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center;
    padding:clamp(28px,5vw,80px) clamp(28px,6vw,110px);
    padding-top:calc(clamp(28px,5vw,80px) + env(safe-area-inset-top,0px));
    padding-bottom:calc(clamp(28px,5vw,80px) + env(safe-area-inset-bottom,0px));
    transition: transform .85s cubic-bezier(.22,.68,.28,1), opacity .6s ease;
    will-change:transform,opacity;
    backface-visibility:hidden;
  }
  .slide--light{background:var(--paper); color:var(--ink);}
  .slide--dark{background:rgba(10,13,24,0.86); color:#F3F6FA;}
  .slide--slate{background:rgba(34,48,71,0.93); color:#F3F6FA;}

  .slide-inner{width:100%; max-width:1180px; margin:0 auto; position:relative;}

  /* ---- reveal-on-enter ---- */
  .reveal{opacity:0; transform:translateY(20px); transition:opacity .6s ease, transform .6s cubic-bezier(.22,.68,.28,1);}
  .slide.in-view .reveal{opacity:1; transform:translateY(0);}

  /* ---- nav chrome ---- */
  #chrome{position:fixed; inset:0; z-index:20; pointer-events:none;}
  #progress-track{position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.12);}
  #progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--teal),var(--amber)); transition:width .5s cubic-bezier(.22,.68,.28,1);}
  #counter{
    position:absolute; left:clamp(20px,4vw,48px); bottom:clamp(16px,3vh,34px);
    font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.03em;
    color:rgba(255,255,255,.65); pointer-events:none;
  }
  #counter b{color:#fff;}
  .navbtn{
    position:absolute; bottom:clamp(16px,3vh,34px);
    width:52px; height:52px; border-radius:50%; border:1px solid rgba(255,255,255,.22);
    background:rgba(20,24,38,.55); backdrop-filter:blur(6px);
    color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; pointer-events:auto; transition:background .2s, transform .2s, border-color .2s;
  }
  .navbtn:hover{background:var(--teal); border-color:var(--teal); transform:translateY(-2px);}
  .navbtn:active{transform:translateY(0) scale(.96);}
  #prevBtn{right:clamp(84px,9vw,118px);}
  #nextBtn{right:clamp(20px,4vw,48px);}
  #fsBtn{
    position:absolute; top:clamp(16px,3vh,28px); right:clamp(20px,4vw,48px);
    width:40px;height:40px;border-radius:50%; border:1px solid rgba(255,255,255,.2);
    background:rgba(20,24,38,.45); color:#fff; display:flex;align-items:center;justify-content:center;
    pointer-events:auto; cursor:pointer; font-size:14px;
  }
  .navbtn.is-light, #fsBtn.is-light{border-color:rgba(15,18,34,.18); background:rgba(255,255,255,.7); color:var(--ink);}
  #counter.is-light{color:rgba(15,18,34,.55);} #counter.is-light b{color:var(--ink);}


  /* ---- shared content atoms ---- */
  .eyebrow{font-size:14px; color:var(--teal); font-weight:600; letter-spacing:.02em; margin:0 0 10px;}
  .slide--light .eyebrow{color:var(--teal-deep);}
  h1.title{font-size:clamp(30px,4.6vw,56px); font-weight:800; line-height:1.08; margin:0 0 16px; letter-spacing:-0.01em;}
  h2.heading{font-size:clamp(24px,3.1vw,38px); font-weight:700; line-height:1.15; margin:0 0 10px;}
  p.lede{font-size:clamp(15px,1.3vw,19px); color:var(--muted); max-width:62ch; line-height:1.55; margin:0;}
  .slide--dark p.lede, .slide--slate p.lede{color:rgba(255,255,255,.72);}

  svg.icn{width:1em; height:1em; display:inline-block; vertical-align:-0.125em; flex-shrink:0; overflow:visible;}
  .icon-circle{
    width:var(--d,64px); height:var(--d,64px); border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:var(--c, var(--teal)); color:#fff; font-size:calc(var(--d,64px)*0.42);
    box-shadow:0 10px 24px -8px rgba(0,0,0,.35);
  }
  .tilt{transition:transform .25s ease;}

  .card{
    background:var(--mist); border-radius:16px; padding:26px 24px;
    border:1px solid var(--line);
  }
  .slide--dark .card, .slide--slate .card{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.12);}
  .card-dark{background:var(--ink); color:#fff; border-radius:16px; padding:26px 24px;}

  footer.foot{position:absolute; left:0; right:0; bottom:clamp(-6px,0vw,0px); font-size:11.5px; color:var(--muted); opacity:.75;}

  /* ---- utility grids ---- */
  .grid{display:grid; gap:18px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g5{grid-template-columns:repeat(5,1fr);}
  @media (max-width:900px){
    .g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr;}
    .slide{padding:24px 20px;}
    h1.title{font-size:clamp(26px,7vw,40px);}
  }
  @media (max-width:560px){
    .g2,.g3,.g4,.g5{grid-template-columns:1fr;}
    .navbtn{width:44px;height:44px;}
    #prevBtn{right:74px;}
  }

  .vs-header{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px;}
  .vs-header-side{display:flex; align-items:center; gap:9px; padding:11px 16px; border-radius:10px 10px 0 0; font-size:14.5px; font-weight:700;}
  .vs-side-rpa{background:var(--slate); color:#fff;}
  .vs-side-ai{background:var(--teal-deep); color:#fff;}
  .vs-row{margin-bottom:10px;}
  .vs-dim{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:5px;}
  .vs-pair{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .vs-rpa, .vs-ai{border-radius:9px; padding:12px 16px; font-size:15px; line-height:1.45;}
  .vs-rpa{background:var(--mist); border:1px solid var(--line); color:var(--ink);}
  .vs-ai{background:var(--ink); color:#F3F6FA;}
  @media (max-width:640px){
    .vs-header, .vs-pair{grid-template-columns:1fr;}
    .vs-header-side{border-radius:10px;}
  }

  .tag{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; padding:4px 11px; border-radius:20px; color:#fff;}

  .ladder-step{position:relative; text-align:center;}
  /* runs from the first icon's centre to the last one's (4 equal columns -> 12.5% to 87.5%) */
  .ladder-line{position:absolute; top:27px; left:12.5%; width:75%; height:2px; background:repeating-linear-gradient(90deg,var(--muted) 0 8px, transparent 8px 16px); opacity:.55; z-index:0;}
  @media (max-width:900px){ .ladder-line{display:none;} }

  /* ---- capability micro-widgets ---- */
  .cap-widget-box{height:52px; display:flex; align-items:center;}

  .cap-code{font-family:'JetBrains Mono',monospace; font-size:11px; color:#DCE4EE; background:#0A0C14; border-radius:9px; padding:9px 12px; width:168px; overflow:hidden;}
  .cap-code-line{display:inline-block; white-space:nowrap; overflow:hidden; border-right:2px solid var(--teal); width:0; animation:capType 4.6s steps(17) infinite;}
  @keyframes capType{0%{width:0;} 45%{width:17ch;} 85%{width:17ch;} 100%{width:0;}}

  .cap-nodes{position:relative; display:flex; align-items:center; gap:13px; width:90px;}
  .cap-nodes .cn-line{position:absolute; left:6px; right:6px; top:50%; height:2px; background:rgba(255,255,255,.15); transform:translateY(-50%);}
  .cap-nodes .cn-dot{position:relative; width:12px; height:12px; border-radius:50%; background:var(--amber); animation:capPulse 1.5s ease-in-out infinite;}
  .cap-nodes .cn-dot:nth-child(3){animation-delay:.25s;}
  .cap-nodes .cn-dot:nth-child(4){animation-delay:.5s;}
  @keyframes capPulse{0%,60%,100%{transform:scale(1); opacity:.45;} 30%{transform:scale(1.5); opacity:1;}}

  .cap-scan{position:relative; width:52px; height:52px; border-radius:14px; background:var(--teal-deep); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .cap-scan svg{color:#fff; font-size:19px; opacity:.85;}
  .cap-scan-beam{position:absolute; left:0; right:0; height:3px; top:0; background:#fff; box-shadow:0 0 10px 2px rgba(255,255,255,.75); animation:capScan 1.9s ease-in-out infinite;}
  @keyframes capScan{0%,100%{top:2px;} 50%{top:47px;}}

  .cap-cursor{position:relative; width:52px; height:52px;}
  .cc-target{position:absolute; left:30px; top:30px; width:14px; height:14px; border-radius:4px; border:1.5px solid rgba(255,255,255,.3);}
  .cc-ripple{position:absolute; left:30px; top:30px; width:14px; height:14px; border-radius:4px; border:2px solid var(--amber); opacity:0; animation:capRipple 2.4s ease-in-out infinite;}
  .cc-ptr{position:absolute; color:#fff; font-size:15px; animation:capCursor 2.4s ease-in-out infinite;}
  @keyframes capCursor{0%,15%{left:2px; top:2px;} 50%,62%{left:28px; top:28px;} 100%{left:2px; top:2px;}}
  @keyframes capRipple{0%,48%{opacity:0; transform:scale(.4);} 58%{opacity:1; transform:scale(1);} 72%,100%{opacity:0; transform:scale(1.5);}}

  .cap-blob{width:50px; height:50px; background:linear-gradient(135deg, var(--teal), var(--amber)); animation:capBlob 5s ease-in-out infinite;}
  @keyframes capBlob{0%,100%{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;} 50%{border-radius:63% 37% 37% 63% / 54% 59% 41% 46%;}}

  .cap-eq{display:flex; align-items:flex-end; gap:4px; height:40px;}
  .cap-eq span{width:6px; background:var(--amber); border-radius:3px; height:10px; animation:capEq 1s ease-in-out infinite;}
  .cap-eq span:nth-child(1){animation-delay:0s;}
  .cap-eq span:nth-child(2){animation-delay:.15s;}
  .cap-eq span:nth-child(3){animation-delay:.3s;}
  .cap-eq span:nth-child(4){animation-delay:.1s;}
  .cap-eq span:nth-child(5){animation-delay:.22s;}
  @keyframes capEq{0%,100%{height:8px;} 50%{height:34px;}}

  /* ---- live agentic RPA visual demo ---- */
  .demo-shell{display:grid; grid-template-columns:1.15fr 1fr; gap:22px; max-width:1040px; margin:0 auto; align-items:start;}
  @media (max-width:860px){ .demo-shell{grid-template-columns:1fr;} }

  .browser-mock{background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 30px 60px -20px rgba(0,0,0,.6);}
  .browser-chrome{background:#E8ECF1; padding:10px 14px; display:flex; align-items:center; gap:6px;}
  .browser-chrome .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .addr-pill{margin-left:10px; background:#fff; border-radius:20px; padding:5px 14px; font-size:13px; color:#51607A; font-family:'JetBrains Mono',monospace; flex:1; display:flex; align-items:center; min-height:26px;}
  .status-strip{background:#F1F5F8; border-bottom:1px solid #E2E8F0; padding:8px 14px; display:flex; align-items:center; gap:9px; font-size:13px; color:#51607A; min-height:16px;}
  .agent-spinner{width:12px;height:12px;border-radius:50%; border:2px solid #CBD5E1; border-top-color:var(--teal); display:inline-block; animation:spin .7s linear infinite; flex-shrink:0; visibility:hidden;}
  .agent-spinner.on{visibility:visible;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .prompt-bubble{max-width:760px; margin:0 auto 14px; background:rgba(23,179,169,.09); border:1px solid rgba(23,179,169,.35); border-radius:12px; padding:11px 18px;}
  .prompt-tag{display:block; font-size:13px; font-weight:700; letter-spacing:.07em; color:var(--teal); margin-bottom:6px;}
  .prompt-text{font-family:'JetBrains Mono',monospace; font-size:14.5px; color:#EAF6F5; margin:0; line-height:1.6; min-height:3.2em;}

  .browser-page{padding:12px; min-height:250px; position:relative; overflow:hidden;}
  /* overlays the results area instead of pushing it down, so the slide height stays constant */
  .search-mock{position:absolute; left:12px; right:12px; top:12px; z-index:2; display:flex; align-items:center; gap:10px; background:#F1F5F8; border:1px solid #E2E8F0; border-radius:8px; padding:9px 14px; font-size:14px; color:#1C2030; font-family:'JetBrains Mono',monospace; opacity:0; transform:translateY(-4px); transition:opacity .35s ease, transform .35s ease;}
  .search-mock.shown{opacity:1; transform:none;}
  .cards-list{transition:opacity .4s ease;}
  .closed-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(255,255,255,.96); color:#51607A; font-size:14.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .4s ease;}
  .closed-overlay.show{opacity:1;}
  .closed-overlay svg{color:var(--teal); font-size:16px;}
  .sc-check{position:absolute; left:8px; top:8px; width:18px; height:18px; border-radius:50%; background:var(--teal); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.5); transition:opacity .25s, transform .25s;}
  .sc-check.flag{background:var(--amber); color:#241A00;}
  .sc-check.show{opacity:1; transform:scale(1);}
  .sc-thumb{width:28px;height:28px;border-radius:7px;background:#EDF1F5;display:flex;align-items:center;justify-content:center;color:#AEB8C4;font-size:14.5px;flex-shrink:0;}
  .scan-card{position:relative; display:flex; align-items:center; gap:11px; background:#fff; border:1px solid #E6EAF0; border-radius:9px; padding:5px 12px; margin-bottom:5px; opacity:0; transform:translateY(8px); transition:opacity .4s ease, transform .4s ease, box-shadow .3s ease, border-color .3s ease;}
  .scan-card .sc-body{flex:1; min-width:0;}
  .scan-card.shown{opacity:1; transform:translateY(0);}
  .scan-card.scanning{box-shadow:0 0 0 2px var(--teal), 0 0 16px rgba(23,179,169,.5); border-color:var(--teal);}
  .sc-top{display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#1C2030; font-weight:600;}
  .sc-badge{background:rgba(242,177,52,.16); color:#B8701F; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; flex-shrink:0; margin-left:8px;}
  .sc-bottom{display:flex; justify-content:space-between; margin-top:3px; font-size:13px; color:#64748B;}
  .sc-rating.sc-missing{color:#AEB8C4; font-style:italic;}
  .sc-callout{position:absolute; right:8px; top:-13px; background:var(--amber); color:#241A00; font-size:13px; font-weight:700; padding:6px 11px; border-radius:8px; box-shadow:0 8px 16px rgba(0,0,0,.3); opacity:0; transform:translateY(5px); transition:opacity .3s, transform .3s; z-index:6; max-width:270px; pointer-events:none;}
  .sc-callout.show{opacity:1; transform:translateY(0);}

  .output-panel{background:var(--ink); border-radius:14px; padding:16px 18px 14px; color:#fff; transition:box-shadow .4s ease;}
  .output-panel.done{box-shadow:0 0 0 2px var(--teal), 0 0 30px rgba(23,179,169,.35);}
  .output-head{font-size:14.5px; font-weight:600; color:#fff; margin-bottom:12px; display:flex; align-items:center;}
  table.out-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.out-table th{text-align:left; color:rgba(255,255,255,.55); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.03em; padding:0 8px 6px 0; border-bottom:1px solid rgba(255,255,255,.15);}
  table.out-table td{padding:6px 8px 6px 0; border-bottom:1px solid rgba(255,255,255,.08); color:#DCE4EE;}
  .out-row{opacity:0; transform:translateY(6px); transition:opacity .4s ease, transform .4s ease;}
  .out-row.show{opacity:1; transform:translateY(0);}
  .out-judgment{color:var(--amber); font-weight:700;}
  #outFootnote{font-size:13px; color:var(--amber); opacity:0; transition:opacity .3s; margin-top:8px;}
  #outFootnote.show{opacity:1;}
  .out-footer{font-size:14px; color:#4ADE80; font-weight:600; margin-top:8px;}
  .out-footer:empty{display:none;}

  .term-line{white-space:pre-wrap; word-break:break-word; min-height:1.85em;}
  .term-cmd{color:#17B3A9; font-weight:600;}
  .term-out{color:#9AA7BC;}
  .term-ok{color:#4ADE80; font-weight:600;}
  .term-warn{color:var(--amber); font-weight:600;}
  .term-gap{min-height:.6em;}
  .caret{animation:blink 0.9s steps(1) infinite; color:#17B3A9;}
  @keyframes blink{50%{opacity:0;}}

  /* ---- explainer kit: shared by every slide so the deck reads as one system ---- */
  /* Headline = one sentence a student could repeat. */
  h2.say{font-size:clamp(23px,2.6vw,34px); line-height:1.18; max-width:38ch; margin:0 0 12px;}
  .center h2.say, .center .txt{margin-left:auto; margin-right:auto;}
  .center{text-align:center;}
  .txt{font-size:clamp(16px,1.3vw,18px); line-height:1.5;}
  .muted{color:var(--muted);}
  .slide--dark .muted, .slide--slate .muted, .card-dark .muted{color:rgba(255,255,255,.68);}
  /* The technical word, shown small next to the plain one: "Uses tools (tool use)". */
  .term{font-size:.8em; font-weight:500; color:var(--muted); white-space:nowrap;}
  .slide--dark .term, .slide--slate .term, .card-dark .term{color:rgba(255,255,255,.55);}
  /* One-line takeaway strip at the bottom of a slide. */
  .takeaway{margin-top:18px; padding:13px 20px; border-radius:12px; background:var(--mint); color:var(--ink); font-size:clamp(15.5px,1.25vw,17.5px); line-height:1.45;}
  .takeaway b{color:var(--teal-deep);}
  .slide--dark .takeaway, .slide--slate .takeaway{background:rgba(23,179,169,.15); color:#EAF6F5; border:1px solid rgba(23,179,169,.45);}
  .slide--dark .takeaway b, .slide--slate .takeaway b{color:#5EEAD4;}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; padding:4px 11px; border-radius:20px; background:var(--mist); border:1px solid var(--line); color:var(--ink); white-space:nowrap;}
  .slide--dark .chip, .slide--slate .chip, .card-dark .chip{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:#F3F6FA;}
  .chip.chip--teal{background:var(--teal-deep); border-color:var(--teal-deep); color:#fff;}
  .chip.chip--amber{background:var(--amber); border-color:var(--amber); color:#241A00;}
  .src{font-size:13px; color:var(--muted); margin:10px 0 0;}
  .slide--dark .src, .slide--slate .src{color:rgba(255,255,255,.55);}
  .ok{color:#15803D;} .bad{color:#B91C1C;}
  .slide--dark .ok, .slide--slate .ok, .card-dark .ok{color:#4ADE80;}
  .slide--dark .bad, .slide--slate .bad, .card-dark .bad{color:#F87171;}
  /* "Part 2 of 3" progress dots on section slides. */
  .part{display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:13.5px; color:rgba(255,255,255,.7);}
  .part i{font-style:normal; width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.3);}
  .part i.done{background:rgba(23,179,169,.25); border-color:var(--teal);}
  .part i.now{background:var(--teal); border-color:var(--teal); color:#fff;}
  .part s{width:26px; height:2px; background:rgba(255,255,255,.25); text-decoration:none;}

  /* ---- speaker notes panel (press N) ---- */
  #notesBtn{position:absolute; top:clamp(16px,3vh,28px); right:calc(clamp(20px,4vw,48px) + 50px); width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(20,24,38,.45); color:#fff; display:flex; align-items:center; justify-content:center; pointer-events:auto; cursor:pointer; font:700 13px 'JetBrains Mono',monospace;}
  #notesBtn.is-light{border-color:rgba(15,18,34,.18); background:rgba(255,255,255,.7); color:var(--ink);}
  #notes{position:fixed; z-index:40; left:clamp(12px,3vw,40px); right:clamp(12px,3vw,40px); bottom:clamp(80px,11vh,100px); max-height:44vh; overflow:auto; background:rgba(10,13,24,.97); color:#EAF0F7; border:1px solid rgba(23,179,169,.55); border-radius:14px; padding:14px 20px 16px; font-size:15.5px; line-height:1.55; box-shadow:0 24px 60px -20px rgba(0,0,0,.75);}
  #notes[hidden]{display:none;}
  .notes-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px; font:600 12.5px 'JetBrains Mono',monospace; letter-spacing:.04em; color:var(--teal);}
  .notes-head button{font:600 12.5px Inter,sans-serif; color:#fff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:5px 10px; cursor:pointer;}
  #notesBody{margin:0; padding-left:20px;} #notesBody li{margin:4px 0;}

  /* ---- agent-loop labels used by the two demos ---- */
  .term-tag{display:inline-block; min-width:64px; margin-right:12px; padding:1px 8px; border-radius:6px; background:rgba(23,179,169,.18); color:#5EEAD4; font-size:13px; font-weight:700; text-align:center; letter-spacing:.04em;}
  .loop-legend{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; margin-top:14px; font:700 14px 'JetBrains Mono',monospace; color:rgba(255,255,255,.45);}
  .loop-legend [data-step]{padding:5px 12px; border-radius:20px; border:1px solid rgba(255,255,255,.18); transition:background .25s, color .25s, border-color .25s;}
  .loop-legend [data-step].on{background:var(--teal); border-color:var(--teal); color:#fff;}
  .loop-legend .loop-back{font:500 13.5px Inter,sans-serif; color:rgba(255,255,255,.6); margin-left:6px;}
  .phase-chip{display:none; font:700 13px 'JetBrains Mono',monospace; letter-spacing:.05em; padding:2px 8px; border-radius:6px; background:var(--teal); color:#fff;}
  .phase-chip.on{display:inline-block;}
  .cmp{margin-top:10px; display:grid; gap:6px; opacity:0; transform:translateY(6px); transition:opacity .4s ease, transform .4s ease;}
  .cmp.show{opacity:1; transform:none;}
  .cmp-row{border-radius:9px; padding:6px 11px; font-size:13.5px; line-height:1.4;}
  .cmp-bot{background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:#FECACA;}
  .cmp-ai{background:rgba(23,179,169,.16); border:1px solid rgba(23,179,169,.5); color:#CCFBF1;}

  /* ---- interactive slides: play buttons (wired by INTERACTIONS in the script) ---- */
  .play-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .play-btn{display:inline-flex; align-items:center; gap:7px; font:700 14px 'Inter',sans-serif; padding:8px 14px; border-radius:22px; cursor:pointer; border:1.5px solid var(--teal); background:var(--teal); color:#fff; box-shadow:0 6px 16px -8px rgba(23,179,169,.8); transition:transform .15s, box-shadow .15s, background .15s;}
  .play-btn:hover{transform:translateY(-1px); box-shadow:0 10px 20px -8px rgba(23,179,169,.9);}
  .play-btn:active{transform:translateY(0) scale(.97);}
  .play-btn.alt{background:transparent; color:var(--teal-deep);}
  .slide--dark .play-btn.alt, .slide--slate .play-btn.alt{color:#5EEAD4;}
  .play-btn.amber{background:var(--amber); border-color:var(--amber); color:#241A00; box-shadow:0 6px 16px -8px rgba(242,177,52,.9);}
  .play-btn:focus-visible{outline:3px solid var(--amber); outline-offset:2px;}
  .play-btn:disabled{opacity:.45; cursor:default; transform:none;}
  /* buttons sit top-right, on the eyebrow line, so they add no height to the slide */
  .play-dock{position:absolute; top:-6px; right:0; z-index:3; display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px; max-width:62%;}
  @media (max-width:760px){ .play-dock{position:static; max-width:none; justify-content:flex-start; margin:0 0 10px;} }

  /* ---- presenter tools: overview (O) and talk timer (T) ---- */
  #overview{position:fixed; inset:0; z-index:60; background:rgba(5,7,13,.97); color:#F3F6FA; overflow:auto; padding:clamp(20px,4vw,48px);}
  #overview[hidden]{display:none;}
  #overview h3{margin:0 0 4px; font:700 22px 'Sora',sans-serif;}
  #overview .ov-keys{margin:0 0 18px; font-size:14px; color:rgba(255,255,255,.65);}
  #overview .ov-keys kbd{font:700 12.5px 'JetBrains Mono',monospace; padding:2px 7px; border:1px solid rgba(255,255,255,.3); border-radius:5px; margin:0 2px;}
  #overview .ov-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;}
  #overview .ov-grid button{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:11px 12px; border-radius:11px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#F3F6FA; font:600 14.5px/1.3 'Inter',sans-serif; cursor:pointer;}
  #overview .ov-grid button:hover{border-color:var(--teal); background:rgba(23,179,169,.14);}
  #overview .ov-grid button.now{border-color:var(--amber); background:rgba(242,177,52,.14);}
  #overview .ov-grid b{font:700 13px 'JetBrains Mono',monospace; color:rgba(255,255,255,.5); min-width:22px;}
  #overview .ov-grid i{font-style:normal; font-size:12.5px; color:#5EEAD4; display:block; margin-top:2px;}
  #talkTimer{position:fixed; z-index:25; top:calc(clamp(16px,3vh,28px) + 4px); right:calc(clamp(20px,4vw,48px) + 100px); display:flex; align-items:center; gap:8px; padding:7px 13px; border-radius:20px; font:700 13px 'JetBrains Mono',monospace; background:rgba(20,24,38,.8); color:#fff; border:1px solid rgba(255,255,255,.2);}
  #talkTimer[hidden]{display:none;}
  #talkTimer.late{background:#B8701F; border-color:var(--amber);}
  #talkTimer.over{background:#B91C1C; border-color:#F87171;}
  #talkTimer span{font-weight:500; color:rgba(255,255,255,.75);}

  /* ---- market chart (plain HTML bars, works offline) ---- */
  .mbar-wrap{display:flex; align-items:flex-end; justify-content:center; gap:40px; height:160px; padding-top:26px;}
  .mbar{width:76px; height:0; border-radius:6px 6px 0 0; position:relative; transition:height .9s cubic-bezier(.22,.68,.28,1) .35s;}
  .slide.in-view .mbar{height:var(--h);}
  .mbar--fc{background:repeating-linear-gradient(135deg, var(--amber) 0 9px, #D99A22 9px 18px);}
  .mbar b{position:absolute; top:-24px; left:50%; transform:translateX(-50%); font-size:15px; color:#fff; white-space:nowrap;}
  .mbar-labels{display:flex; justify-content:center; gap:40px; margin-top:8px;}
  .mbar-labels span{width:76px; text-align:center; font-size:13px; line-height:1.3; color:rgba(255,255,255,.75);}

  /* ---- hybrid reality diagram ---- */
  .hyb{max-width:900px; margin:0 auto; text-align:left;}
  .hyb-lane{border-radius:14px; padding:16px 18px;}
  .hyb-agent{background:var(--ink); color:#F3F6FA;}
  .hyb-rpa{background:var(--mist); border:1px solid var(--line);}
  .hyb-label{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:12px;}
  .hyb-agent .hyb-label{color:var(--teal);}
  .hyb-rpa .hyb-label{color:var(--slate);}
  .hyb-outs{display:flex; flex-wrap:wrap; gap:10px;}
  .hyb-out{border:1px solid rgba(255,255,255,.2); border-radius:20px; padding:7px 14px; font-size:15px;}
  .hyb-out b{color:var(--amber);}
  .hyb-link{text-align:center; color:#B8701F; font-size:14px; font-weight:700; padding:10px 0;}
  .hyb-steps{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .hyb-step{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; font-weight:600; color:var(--ink);}
  .hyb-step i{font-style:normal; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--slate); color:#fff; font-size:12px; margin-right:7px;}
  .hyb-step small{display:block; font-weight:500; color:var(--muted); font-size:13px; margin-top:4px;}
  .hyb-step--exc{border-color:var(--amber); box-shadow:0 0 0 2px rgba(242,177,52,.45);}
  .hyb-step--exc i{background:var(--amber); color:#241A00;}
  @media (max-width:760px){ .hyb-steps{grid-template-columns:1fr 1fr;} }

  /* ---- QR codes, closing slide, video link ---- */
  .qr-tile{display:block; margin:0 auto; background:#fff; padding:10px; border-radius:12px; line-height:0; box-shadow:0 14px 30px -12px rgba(0,0,0,.5);}
  .qr-tile svg{display:block; width:100%; height:auto;}
  .hub-img{width:min(clamp(200px,24vw,320px), 40vh);} /* stays clear of the title QR on short windows */
  @media (max-width:760px), (max-height:500px){ .qr-float{display:none;} }
  @media (max-width:640px){ .closing-grid, .market-grid{grid-template-columns:1fr !important;} .mbar-wrap{height:110px;} }
  .video-link{display:block; border:1px solid rgba(255,255,255,.18); border-radius:18px; padding:54px 24px; background:rgba(255,255,255,.03); text-decoration:none; transition:background .2s, border-color .2s;}
  .video-link:hover{background:rgba(23,179,169,.1); border-color:var(--teal);}

  @media (prefers-reduced-motion: reduce){
    :root:not(.force-motion) .slide, :root:not(.force-motion) .reveal, :root:not(.force-motion) .mbar{transition:none !important;}
  }
</style>

function svgIcon(faClass, extraClass){
  const key = faClass.replace(/^fa-/, "");
  const svg = ICONS[key];
  if(!svg) return "";
  const cls = "icn" + (extraClass ? " " + extraClass : "");
  return svg.replace("<svg ", `<svg class="${cls}" `);
}

function qrSvg(rows, quiet = 2){
  const n = rows.length, size = n + quiet * 2;
  let d = '';
  rows.forEach((hex, r) => {
    const bits = BigInt('0x' + hex).toString(2).padStart(n, '0');
    for(let c = 0; c < n; c++) if(bits[c] === '1') d += `M${c + quiet} ${r + quiet}h1v1h-1z`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="QR code linking to ${REPO_URL}"><path fill="#0F1222" d="${d}"/></svg>`;
}

- Second line: AI image tools were famous for drawing hands with six fingers. They learned from photos where hands are often half-hidden, so they guessed. Newer tools are much better, but it shows how AI works: it guesses from patterns.

{ theme:'light', label:'What is AI?', notes:`- Read the headline slowly. This one sentence is the definition for the whole day.
- Walk the three steps with your hand, left to right. 1: we show the AI thousands of photos, each one marked "cat" or "dog". 2: nobody writes rules like "cats have pointy ears". The AI works out the pattern by itself. 3: we show it a photo it has never seen, and it makes a guess: "cat, 96% sure".
- Stress the "96% sure": AI makes a good guess, not a perfect answer. It can be wrong. We come back to this on the next slide.
- Point at the bottom row: "You use AI every day." Face unlock learned your face. Maps learned traffic from millions of phones. YouTube learned what people like you watch. The spam filter learned from emails marked spam. Voice typing is what listened to you on slide 4.
- Answer the question from slide 4: "Is your BCG701 bot AI? No. It follows the steps you wrote, every time. It never learns from examples. That is useful, but it is not AI by itself." The AI vs RPA slide comes in two slides.
- If asked for an official view: the EU AI Act (Recital 12) also leaves out systems that only follow rules written by people.
- Ask the room: "Face unlock: rules someone wrote, or a pattern learned from examples?" (Learned from examples, so it is AI.)`, html:`

{ theme:'light', label:'How an LLM works', interactive:'llm', notes:`- Say: "ChatGPT, Gemini and Claude are LLMs: Large Language Models. Here is the secret: they write ONE word at a time."
- Click "Watch it write". The LLM reads "The capital of India is", scores every possible next word, and picks the most likely one: "New" (92%). It adds that word and guesses again: "Delhi" (97%, and "York" gets 1%: a joke worth pointing at). Then the full stop. Done.
- Point at the loop arrow: read the text so far, guess the next word, add it, repeat. A long ChatGPT answer is this loop running hundreds of times.
- Your phone keyboard does a tiny version of this: the three word suggestions above the keys. An LLM is the same idea, trained on a huge amount of text.
- Then click "Ask it something it can't know": "The IPL 2027 winner will be". Nobody knows yet. The scores are close (RCB 31%, CSK 29%, MI 27%), but it still picks one and writes it like a fact. That is a hallucination: fluent, confident and made up. (Expect cheers from the RCB fans, and boos from everyone else.)
- RPA lesson: an LLM is great with language, but check its facts. In automation, check AI output with rules and send unsure cases to a person.
- Detail, if asked: it really predicts "tokens" (pieces of words). The percentages are an illustration, not real model output.`, html:`
  <div class="slide-inner s06">

      .s06 .s06-msg--warn svg{color:#B8701F;}
      @keyframes s06-shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}}
      .s06 .s06-src{margin:6px 0 0; text-align:right;}

        .s06 .s06-loop{display:none;}
      }
    </style>
    <div class="play-dock">
      <button type="button" class="play-btn" data-act="write">▶ Watch it write</button>
      <button type="button" class="play-btn amber" data-act="unknown">⚡ Ask it something it can’t know</button>
    </div>
    <p class="eyebrow reveal">What happens inside ChatGPT, Gemini and Claude</p>
    <h2 class="heading say reveal">An LLM writes one word at a time: it guesses the most likely next word, adds it, and repeats.</h2>
    <p class="txt s06-def reveal"><b>LLM</b> = Large Language Model. It learned which words usually follow which, from a huge amount of text.</p>
    <div class="s06-machine reveal" role="img" aria-label="The LLM reads the text so far, The capital of India is, scores every possible next word, and picks the most likely: New, 92 percent. It adds the word and repeats.">
      <div><p class="s06-h">1 · The text so far</p><div class="s06-text" aria-live="polite"><span class="s06-prompt">The capital of India is</span><span class="s06-gen"></span><span class="s06-cur"></span></div></div>
      <div class="s06-arr">${svgIcon('fa-arrow-right')}</div>
      <div><p class="s06-h">2 · The LLM</p><div class="s06-llm">${svgIcon('fa-lightbulb')}LLM<small>scores every possible next word</small></div></div>
      <div class="s06-arr">${svgIcon('fa-arrow-right')}</div>
      <div><p class="s06-h s06-stepname">3 · Its top guesses</p><div class="s06-cands"><div class="s06-c s06-c--pick"><span class="s06-w">New</span><span class="s06-track"><span class="s06-bar" style="width:92%;"></span></span><span class="s06-p">92%</span></div><div class="s06-c"><span class="s06-w">Delhi</span><span class="s06-track"><span class="s06-bar" style="width:4%;"></span></span><span class="s06-p">4%</span></div><div class="s06-c"><span class="s06-w">a</span><span class="s06-track"><span class="s06-bar" style="width:2%;"></span></span><span class="s06-p">2%</span></div></div></div>
    </div>
    <div class="s06-loop reveal" aria-hidden="true"><span>↺ add the picked word to the text, then guess again</span></div>
    <div class="s06-out">
      <p class="s06-msg s06-msg--ok" hidden>${svgIcon('fa-circle-check')}<span><b>Done.</b> It wrote the answer one word at a time. It did not look anything up: “New Delhi” is simply the most likely next words.</span></p>
      <p class="s06-msg s06-msg--warn" hidden>${svgIcon('fa-triangle-exclamation')}<span><b>Nobody knows this yet,</b> but it still picked a word and wrote it like a fact. That is a <b>hallucination</b>: fluent, sure of itself, and made up.</span></p>
    </div>
    <p class="src s06-src">Percentages are an illustration, not real model output.</p>
    <p class="takeaway reveal"><b>An LLM is a brilliant next-word guesser:</b> great with language, but its facts need checking.</p>
  </div>`},

{ theme:'light', label:'AI vs. RPA', interactive:'layout', notes:`- Say: "If you remember one sentence from Part 1, make it this one: RPA is the hands, AI is the judgment." Same job on both sides: get the invoice total into Excel.
- Left, RPA: this is your BCG701 bot. It does exactly the steps you recorded: open the email, open the PDF, copy the text at one fixed spot (the selector), paste it into Excel. Fast, cheap, never tired, and it never thinks.
- Right, AI: the vendor did not send a neat PDF, just a casual email: "pls clear 48.5k". There is no fixed spot to copy from. The AI reads it like a person would and understands: amount 48,500, vendor Acme, for the March design work.
- Click "Change the layout": the vendor sends a new invoice format with the total in a different place. The bot looks at its fixed spot, finds nothing and stops. The AI reads the new wording and still gets the right answer.
- Ask the room: "Which of your BCG701 bots stopped working when a window or a web page changed?" That is the left side.
- Be fair to RPA: it is exact and repeatable. AI copes with new input, but it can be wrong and still sound sure (the hallucination from the last slide), so a person or a rule checks it.
- UiPath's AI-assisted selectors and Healing Agent now soften the "breaks" problem. That is AI inside RPA, coming in Part 2. Put both together and you get an AI agent that uses bots as its hands: you build a small one in Project 3.`, html:`

{ theme:'light', label:'AI vs agentic AI', interactive:'agent', notes:`- Say: "We know what AI is. Now the main topic of today: agentic AI. Here is the whole difference in one slide."
- Read the two headers: AI thinks and answers. Agentic AI thinks and acts.
- Click "Give both the same job". Both get the same request about this week's invoices.
- Left, AI (like ChatGPT): it gives good advice, step by step. Then you still open every email yourself. It only talks.
- Right, agentic AI: it does the job. Read the tags: LOOK (reads 12 emails), THINK (finds 11 invoices, one has no invoice number), ACT (updates the Excel tracker), CHECK (the totals match), and it hands you only the one invoice it could not finish.
- Point at the formula: agentic AI is the same AI brain, plus tools (the hands: mailbox, PDF reader, Excel), plus a goal, plus permission to act. Take away the tools and the permission, and it can only talk again.
- Ask the room: "You ask an AI to book a train ticket and it only lists the steps. AI or agentic AI? What would make it agentic?" (Tools, the IRCTC site, and permission to pay.)
- Definition (Anthropic, "Building effective agents", Dec 2024): agents are LLMs using tools based on feedback from their environment, in a loop. Those tags are the loop: the next slide shows it in full.
- Many chat apps now include some agent features. The test is not the app's name: does it act with tools toward a goal? 12 emails and 11 invoices are example numbers.`, html:`

        <p class="res res--agent">→ The agent did the work. <small>You check one item.</small></p>
      </div>
    </div>
    <div class="reveal eq">
      <span class="lhs">Agentic AI =</span>
      <span class="chip">${svgIcon('fa-lightbulb')} AI <small>the brain</small></span><span class="op">+</span>
      <span class="chip">${svgIcon('fa-wrench')} tools <small>the hands</small></span><span class="op">+</span>
      <span class="chip">${svgIcon('fa-bullseye')} a goal</span><span class="op">+</span>
      <span class="chip">${svgIcon('fa-key')} permission to act</span>
    </div>
    <p class="takeaway reveal"><b>If it only answers, it’s AI. If it uses tools to reach a goal, it’s agentic AI.</b></p>
  </div>`},

{ theme:'dark', label:'The agent loop', interactive:'loop', notes:`- Say: "This is the most important picture today. Every agent runs one loop: LOOK, THINK, ACT, CHECK, until the goal is met. Let's watch one do a real job."
- Use "Step ›" to go one move at a time and explain each one, or "▶ Play" to let it run (about 25 seconds). The ring on the left lights the current step; the caption says what it is doing.
- GOAL: every new invoice is in the Excel tracker. Nobody tells it which clicks to make.
- LOOK: it reads the inbox and sorts it: three invoices, and one email about lunch that it ignores. A StudioX bot would need a rule for every subject line.
- THINK: it opens the first invoice and checks what it EXPECTS to find: an invoice number, a vendor and a total. All three are there.
- ACT: it uses a tool, Excel, and adds the row. CHECK: it reads the row back. It matches the invoice. Not done yet, so it goes round the loop again for the next invoice.
- The third invoice has no invoice number. THINK: guessing a number is risky. So it does not act: it stops and asks a person, with a note saying why. That is the second way out of the loop.
- End: 2 invoices added, 1 sent to a person, and a short report. Good agents also have a stop rule (for example, at most 3 tries), so they never loop forever.
- Ask the room: "Your StudioX bot: which of these four steps does it do?" (It acts, but it does not look, think or check by itself. Its path is fixed.)
- Source: Anthropic, "Building effective agents" (Dec 2024): agents are LLMs using tools based on feedback from their environment, in a loop. Technical names, if asked: perceive, reason and plan, act (use a tool), observe. The vendors and amounts are made up.`, html:`

{ theme:'light', label:'Six agent features', notes:`- Say: "An LLM on its own only writes text. These six features turn it into an agent. The chip on each card shows which step of the loop it powers."
- Walk the invoice job across the cards: the goal is the deadline, the plan is the four steps, the tools are your bots, memory stops a double payment, the self-check catches a wrong total, and the limit makes it wait for a person.
- Ask the room: "Which of these six does your StudioX bot already have?" (Answer: only "uses tools", in a way. It has no goal, plan, memory or self-check, and it never decides to ask.)
- AWS, IBM and Google describe agents with these same features. A UiPath agent is built from exactly these parts: a prompt (the goal), context (memory), tools (robots, APIs) and escalations (ask a person) (source: UiPath Agents docs).
- On "Uses tools": MCP (Model Context Protocol) is an open standard, "like a USB-C port for AI apps", that lets agents plug into tools and data (modelcontextprotocol.io). UiPath Orchestrator can expose your RPA workflows as MCP tools, so your bots become tools an agent can call.
- Feature 6 is the safety feature. Without limits and a person's OK on risky steps, an agent is not ready for real company work.`, html:`

    <p class="eyebrow reveal">What makes AI “agentic”</p>
    <h2 class="heading say reveal">Six features turn an LLM into an agent.</h2>
    <p class="legend reveal">The chip on each card shows the loop step it powers:
      <span class="lc">GOAL</span><span class="ar">→</span><span class="lc">LOOK</span><span class="ar">→</span><span class="lc">THINK</span><span class="ar">→</span><span class="lc">ACT</span><span class="ar">→</span><span class="lc">CHECK</span><span class="ar">→</span><span class="lc lc--p">ask a person</span>

        <div class="hd"><span class="icon-circle" style="--d:44px;--c:var(--teal);">${svgIcon('fa-bullseye')}</span><h3 class="nm">Works toward a goal <span class="term">(goal-driven)</span></h3></div>
        <p class="ex">You say “all invoices in the tracker by 10&nbsp;am”, not every click.</p>
      </div>
      <div class="reveal f"><span class="lc">THINK</span>
        <div class="hd"><span class="icon-circle" style="--d:44px;--c:var(--teal);">${svgIcon('fa-list')}</span><h3 class="nm">Makes a plan <span class="term">(planning)</span></h3></div>
        <p class="ex">Read mail → get fields → update Excel → send summary.</p>
      </div>
      <div class="reveal f"><span class="lc">ACT</span>
        <div class="hd"><span class="icon-circle" style="--d:44px;--c:var(--teal);">${svgIcon('fa-wrench')}</span><h3 class="nm">Uses tools <span class="term">(tool use)</span></h3></div>
        <p class="ex">Calls your Excel bot, the mailbox, the vendor list.</p>
      </div>
      <div class="reveal f"><span class="lc">LOOK</span>
        <div class="hd"><span class="icon-circle" style="--d:44px;--c:var(--teal);">${svgIcon('fa-database')}</span><h3 class="nm">Remembers <span class="term">(memory &amp; context)</span></h3></div>
        <p class="ex">Sees INV-2291 was paid last week: no double payment.</p>
      </div>
      <div class="reveal f"><span class="lc">CHECK</span>
        <div class="hd"><span class="icon-circle" style="--d:44px;--c:var(--teal);">${svgIcon('fa-rotate')}</span><h3 class="nm">Checks its own work <span class="term">(self-correction)</span></h3></div>
        <p class="ex">Total ≠ sum of the lines? Reads the PDF again.</p>
      </div>
      <div class="reveal f f--safe"><span class="lc lc--p">ask a person</span>
        <div class="hd"><span class="icon-circle" style="--d:44px;--c:var(--amber);color:#241A00;">${svgIcon('fa-shield-halved')}</span><h3 class="nm">Knows when to ask <span class="term">(guardrails &amp; <span class="nb">human-in-the-loop</span>)</span></h3></div>
        <p class="ex">Amount above the limit? Waits for a person’s OK.</p>
      </div>
    </div>
    <p class="takeaway reveal"><b>Goal + plan + tools + memory + self-check + limits = an agent.</b></p>
  </div>`},

{ theme:'dark', label:'Demo: an agent meets a surprise', demo:'rpa',
notes:`- Point at the green box first: the agent gets a goal in plain English. Nobody wrote the clicks.
- Watch the small chip in the browser's status bar. It shows the loop step: GOAL, THINK (plan), ACT, LOOK, THINK, ACT, CHECK.
- The key moment is listing 3. It has no rating. A fixed StudioX bot built with Get Text would fail on that missing field ("Rating not found"), or save a blank row. The agent decides to keep it as a "new listing" and writes down why.
- Ask the room: "Was that the right call? What would you have wanted it to do?" This is judgment, the thing RPA alone does not have.
- This is the same idea as the watcher agent in Project 3: something unexpected happens, and the agent chooses the next step.
- Be honest: this is a simulation on a made-up shop. Real shopping sites block bots and their terms forbid scraping. In the lab, practise on a site built for it, such as books.toscrape.com.
- If the animation shows only the final table, the laptop has animations turned off: add #animate to the end of the deck's address.`,

{ theme:'light', label:'The automation ladder', notes:`- Point at the amber pin: everything you did in BCG701 (5 modules, 11 lab experiments in UiPath StudioX) sits on step 1.
- StudioX is made for "citizen developers": people who automate their own work without being programmers. The chips are the BCG701 modules you already know.
- Step 2, Studio, is the professional tool: it adds variables, arguments and reusable workflows.
- Step 3, Orchestrator, is the cloud control room that schedules and watches robots, so they run unattended: nobody sits at the PC.
- Step 4 is where AI joins: an agent watches the runs and picks the next step when something breaks. It is the "agentic automation" stop from the timeline slide.
- Ask the room: "Hands up if you have opened UiPath Studio, not StudioX." Most will not have, and that is fine.
- Project 3 this afternoon climbs steps 2 to 4, one level per step (the white labels): Basic = rebuild one of your own BCG701 Excel bots in UiPath Studio, with variables, arguments and a reusable workflow. Advanced = publish it to Orchestrator, run it unattended on a schedule, add a queue and a retry-or-escalate rule (the most interview-relevant RPA skill). Expert = a watcher agent that reads the Orchestrator job log and decides retry, escalate or stop for each job; you describe it in plain English as a spec in Kiro.
- Projects 1 and 2 are the Python track: a stock market analyzer and a morning news digest. Students do not type the code; they direct GitHub Copilot in Agent mode, which is itself an AI agent going round the loop. AI joins at the expert level (a free Gemini key).
- Point at the takeaway: "Want to build on BCG701? Project 3. Want Python and AI? Projects 1 or 2."`,

{ theme:'light', label:'AI inside RPA: six places', notes:`- Walk the six cards quickly. For each one, point at the teal "Builds on" chip and say: "You already know this part from BCG701. AI makes it smarter."

- Other vendors have the same ideas, for example Microsoft AI Builder reads invoices inside Power Automate.
- Ask the room: "Which of these six would have saved you the most time in your BCG701 lab?"
- The dark card, "Manages the bots", is the one you build a small version of in Project 3.

      <div class="card s19-card reveal">
        <div class="s19-hd"><span class="icon-circle" style="--d:40px;--c:var(--teal-deep);">${svgIcon('fa-envelope')}</span><div><b>Understands emails</b><span class="term">(communications mining)</span></div></div>
        <p class="s19-line">Sorts mail by meaning, not by keywords.</p>
        <p class="s19-eg">e.g. UiPath Communications Mining</p>
        <span class="chip chip--teal s19-built">Builds on: <b>Mail</b></span>
      </div>
      <div class="card s19-card reveal">
        <div class="s19-hd"><span class="icon-circle" style="--d:40px;--c:var(--teal-deep);">${svgIcon('fa-pen')}</span><div><b>Writes and summarizes</b><span class="term">(generative AI steps)</span></div></div>
        <p class="s19-line">Drafts replies and reports for you to approve.</p>
        <p class="s19-eg">e.g. UiPath GenAI Activities</p>
        <span class="chip chip--teal s19-built">Builds on: <b>Word + PowerPoint</b></span>
      </div>
      <div class="card s19-card reveal">
        <div class="s19-hd"><span class="icon-circle" style="--d:40px;--c:var(--teal-deep);">${svgIcon('fa-arrow-pointer')}</span><div><b>Fixes broken clicks</b><span class="term">(self-healing)</span></div></div>
        <p class="s19-line">Closes a pop-up, adjusts a selector, waits for a slow page.</p>
        <p class="s19-eg">e.g. UiPath Healing Agent</p>
        <span class="chip chip--teal s19-built">Builds on: <b>UI automation</b></span>
      </div>
      <div class="card s19-card reveal">
        <div class="s19-hd"><span class="icon-circle" style="--d:40px;--c:var(--teal-deep);">${svgIcon('fa-magnifying-glass')}</span><div><b>Finds what to automate</b><span class="term">(process &amp; task mining)</span></div></div>
        <p class="s19-line">Studies how people work and ranks what to automate.</p>
        <p class="s19-eg">e.g. UiPath Process Mining</p>
        <span class="chip chip--teal s19-built">Builds on: <b>Module 1 (ROI)</b></span>
      </div>
      <div class="card-dark s19-card reveal">
        <div class="s19-hd"><span class="icon-circle" style="--d:40px;--c:var(--teal);">${svgIcon('fa-bolt')}</span><div><b>Manages the bots</b><span class="term">(agentic orchestration)</span></div></div>
        <p class="s19-line">Picks the next bot, handles failures, asks people.</p>
        <p class="s19-eg">e.g. UiPath Maestro</p>
        <span class="chip chip--teal s19-built">Builds on: <b>Orchestrator → Project 3</b></span>
      </div>
    </div>
    <p class="takeaway reveal"><b>You learned the hands.</b> AI adds the eyes and the judgment. Next: watch two of these at work on one job.</p>
  </div>`},

// ---- 20-three-ways.js ----
{ theme:'light', label:'One invoice, three ways', interactive:'surprise', notes:`- Link from the last slide: "Those were six places AI sits inside RPA. Now watch two of them, Reads documents and Manages the bots, go to work on one job you know." The grey labels under B and C name the card each row uses.
- Read the four steps once: Read inbox, Get invoice fields, Update Excel, Send summary. It is the invoice job from the agent loop slide, and it is the same in all three rows.
- Click "Throw a surprise" (top right). The same surprise runs through all three rows at once, and the right-hand column shows what happens. Each click gives the next one: new layout, Excel timeout, Ravi Traders' invoice with no number (the same one from the agent loop slide), an invoice already paid. Ask the room to predict each row before the result appears.
- Watch the scoreboard under each row ("alone: 3/4" = surprises handled without a person). After all four: A 0, B 1, C 3. C's fourth was a risky one, and asking a person was the right call. That is the point: the agent does not do everything alone, it knows when to ask. The outcomes are illustrations, not measurements.
- Row A, your BCG701 bot: a new vendor sends a different invoice layout, the bot cannot find the fields and stops. Steps 3 and 4 never run. A person fixes it by hand, every time.
- Row B, AI-assisted bot: AI reads the invoice (document understanding). When it is sure, the data goes straight to Excel. When it is not sure, a person checks those fields.
- Row C, agent + bots: an agent watches every run and picks the next step. "Timeout, retry" is job J-1001 and "invoice number missing, ask a person" is job J-1003 in the lab's sample log.
- Row C is how AI is used in RPA in real companies today: the bot does the scheduled steps, the agent watches every run and, on a surprise, chooses retry, ask a person, or skip, and writes down why. That choice is what makes it an agent.
- UiPath sells exactly this pattern ("AI agents, robots and people" working together in Maestro). It is also what the Project 3 watcher decides: retry, escalate or stop.
- Ask the room: "In row C, which surprise would you NOT let the agent handle alone?"
- This is the timeline from the "How we got here" slide again, shown on one process.`,
html:`
  <div class="slide-inner s20inv">
    <style>
      .s20inv .s20-tbl{display:grid; gap:8px; margin-top:4px;}
      .s20inv .s20-row{display:grid; grid-template-columns:clamp(128px,calc(22vw - 97px),185px) minmax(0,1fr) clamp(150px,calc(24vw - 92px),215px); gap:clamp(10px,1.1vw,14px); align-items:center;}
      .s20inv .s20-head{padding:0 calc(clamp(10px,1.1vw,14px) + 1px); font-size:13.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);}
      .s20inv .s20-whoh{display:flex; align-items:center; gap:7px; color:var(--ink); font-size:15.5px; letter-spacing:0; text-transform:none;}
      .s20inv .s20-whoh svg{color:#B8701F; font-size:17px;}
      .s20inv .s20-lane{background:var(--mist); border:1px solid var(--line); border-radius:14px; padding:10px clamp(10px,1.1vw,14px);}
      .s20inv .s20-gen{display:flex; align-items:center; gap:10px;}
      .s20inv .s20-l{width:32px; height:32px; border-radius:50%; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; font:800 15px 'Sora',system-ui,sans-serif; color:#fff;}
      .s20inv .s20-gen b{display:block; font:700 16px/1.25 'Sora',system-ui,sans-serif;}
      .s20inv .s20-gen .term{display:block; margin-top:2px; font-size:13.5px;}
      .s20inv .s20-flow{display:grid; grid-template-columns:minmax(max-content,1fr) 14px minmax(max-content,1fr) 14px minmax(max-content,1fr) 14px minmax(max-content,1fr); align-items:center; row-gap:6px;}
      .s20inv .s20-flow > i{font-style:normal; text-align:center; color:var(--muted); font-weight:700;}
      /* notes and the agent band span several columns: keep them out of the column sizing so all three lanes line up */
      .s20inv .s20-note, .s20inv .s20-band{width:0; min-width:100%;}
      .s20inv .s20-st{position:relative; background:#fff; border:1px solid #CBD5E1; border-radius:9px; padding:7px clamp(7px,.7vw,9px); font-size:clamp(14px,1.2vw,15px); font-weight:600; text-align:center; white-space:nowrap;}
      .s20inv .s20-st em{position:absolute; top:-9px; right:-7px; width:21px; height:21px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:13px; font-weight:800; color:#fff;}
      .s20inv .s20-fail{border:2px solid #B91C1C; background:#FEF2F2; color:#7F1D1D;}
      .s20inv .s20-fail em{background:#B91C1C;}
      .s20inv .s20-dim{opacity:.4;}
      .s20inv .s20-ai{background:var(--teal-deep); border-color:var(--teal-deep); color:#fff;}
      .s20inv .s20-ai em{background:#fff; color:var(--teal-deep); border:2px solid var(--teal-deep);}
      .s20inv .s20-note{grid-column:3 / -1; margin:0; font-size:15px; line-height:1.35; font-weight:600;}
      .s20inv .s20-per{color:#92400E;}
      .s20inv .s20-band{grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; background:var(--ink); border-bottom:3px solid var(--teal); border-radius:10px; padding:7px 12px;}
      .s20inv .s20-band b{flex-basis:100%; display:flex; align-items:center; gap:7px; color:#5EEAD4; font-size:14.5px;}
      .s20inv .s20-band span{background:var(--amber); color:#241A00; font-size:13.5px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap;}
      .s20inv .s20-who{display:flex; align-items:center; gap:9px; border-left:2px solid var(--line); padding-left:12px; font-size:16px; font-weight:700; line-height:1.3;}
      .s20inv .s20-ics{display:flex; flex-shrink:0;}
      .s20inv .s20-ics i{width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:15px; color:#fff; border:2px solid var(--mist);}
      .s20inv .s20-ics i + i{margin-left:-8px;}
      /* "Throw a surprise": the lanes go neutral, steps light up in turn, the hit step shows the result */
      .s20inv .s20-sname{background:var(--ink); color:#fff; font-size:14px; font-weight:600; padding:6px 12px; border-radius:20px;}
      .s20inv .s20-sname[hidden]{display:none;}
      .s20inv .s20-score{display:inline-block; margin-top:4px; font:700 13px 'JetBrains Mono',monospace; padding:2px 8px; border-radius:6px; background:var(--ink); color:#5EEAD4; animation:s20-in .35s ease 1;}
      .s20inv .s20-score[hidden]{display:none;}
      .s20inv .s20-play .s20-st{background:#fff; border:1px solid #CBD5E1; color:var(--ink); opacity:.4; transition:opacity .25s, background .25s, border-color .25s;}
      .s20inv .s20-play .s20-st em{display:none;}
      .s20inv .s20-play .s20-note{visibility:hidden;}
      .s20inv .s20-play .s20-band span{opacity:.4; transition:opacity .25s, transform .25s;}
      .s20inv .s20-play .s20-band span.p-hit{opacity:1; transform:scale(1.08); box-shadow:0 0 0 3px #fff;}
      .s20inv .s20-play .s20-st.p-on{opacity:1; border-color:var(--teal); box-shadow:0 0 0 3px rgba(23,179,169,.18);}
      .s20inv .s20-play .s20-st.p-ok{opacity:1; background:var(--teal-deep); border-color:var(--teal-deep); color:#fff;}
      .s20inv .s20-play .s20-st.p-bad{opacity:1; border:2px solid #B91C1C; background:#FEF2F2; color:#7F1D1D; animation:s20-shake .45s ease 1;}
      .s20inv .s20-play .s20-st.p-warn{opacity:1; border:2px solid var(--amber); background:#FFF4DB; color:#7A4D00;}
      .s20inv .s20-play .s20-st.p-skip{opacity:1; border:2px dashed var(--teal-deep); color:var(--muted); text-decoration:line-through;}
      .s20inv .s20-res{display:block; font-size:15px; font-weight:600; line-height:1.3; animation:s20-in .35s ease 1;}
      .s20inv .s20-res b{display:block;}
      .s20inv .s20-res--bad b{color:#B91C1C;}
      .s20inv .s20-res--warn b{color:#8F5B00;}
      .s20inv .s20-res--ok b, .s20inv .s20-res--retry b, .s20inv .s20-res--skip b{color:#15803D;}
      @keyframes s20-shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}}
      @keyframes s20-in{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
      @media (prefers-reduced-motion: reduce){ :root:not(.force-motion) .s20inv *{transition:none !important; animation:none !important;} }
      @media (max-width:1100px){ .s20inv .s20-who, .s20inv .s20-gen{flex-direction:column; align-items:flex-start; gap:5px;} .s20inv .s20-gen .term{display:none;} .s20inv .s20-lane{padding-top:7px; padding-bottom:7px;} }
      @media (max-width:900px){
        .s20inv .s20-row{grid-template-columns:1fr;}
        .s20inv .s20-head{display:none;}
        .s20inv .s20-flow{grid-template-columns:1fr; justify-items:start;}
        .s20inv .s20-flow > i{display:none;}
        .s20inv .s20-note{grid-column:1;}
        .s20inv .s20-who{border-left:0; padding-left:0;}
      }
    </style>
    <div class="play-dock"><span class="s20-sname" aria-live="polite" hidden></span><button type="button" class="play-btn amber" data-act="surprise">⚡ Throw a surprise</button></div>
    <p class="eyebrow reveal">Those AI places, at work on one job you know</p>
    <h2 class="heading say reveal">Same invoice job, three generations. What changes is who handles the surprises.</h2>
    <div class="s20-tbl" role="group" aria-label="The same four-step invoice job done three ways: a rules bot fails on a new layout and a person fixes it; an AI-assisted bot reads any layout and asks a person only when unsure; an agent watches every run and handles surprises, asking a person only for risky ones.">
      <div class="s20-row s20-head reveal">
        <span>Generation</span>
        <span>The same four steps</span>
        <span class="s20-whoh">${svgIcon('fa-triangle-exclamation')}Who handles surprises?</span>
      </div>
      <div class="s20-row s20-lane reveal">
        <div class="s20-gen"><span class="s20-l" style="background:var(--slate);">A</span><div><b>Your BCG701 bot</b><span class="term">rules only</span><span class="s20-score" hidden></span></div></div>
        <div class="s20-flow">
          <span class="s20-st">Read inbox</span><i>→</i>
          <span class="s20-st s20-fail">Get invoice fields<em>✗</em></span><i>→</i>
          <span class="s20-st s20-dim">Update Excel</span><i>→</i>
          <span class="s20-st s20-dim">Send summary</span>
          <p class="s20-note"><span class="bad">✗ New vendor layout? The bot fails.</span> <span class="s20-per">→ A person fixes it by hand.</span></p>
        </div>
        <div class="s20-who"><span class="s20-ics"><i style="background:var(--amber);color:#241A00;">${svgIcon('fa-user')}</i></span>You, every time</div>
      </div>
      <div class="s20-row s20-lane reveal">
        <div class="s20-gen"><span class="s20-l" style="background:var(--teal-deep);">B</span><div><b><span style="white-space:nowrap;">AI-assisted</span> bot</b><span class="term">uses: Reads documents</span><span class="s20-score" hidden></span></div></div>
        <div class="s20-flow">
          <span class="s20-st">Read inbox</span><i>→</i>
          <span class="s20-st s20-ai">Get invoice fields<em>${svgIcon('fa-lightbulb')}</em></span><i>→</i>
          <span class="s20-st">Update Excel</span><i>→</i>
          <span class="s20-st">Send summary</span>
          <p class="s20-note">AI reads any layout. <span class="ok">Sure → Excel ✓</span> · <span class="s20-per">Not sure → a person checks</span></p>
        </div>
        <div class="s20-who"><span class="s20-ics"><i style="background:var(--teal-deep);">${svgIcon('fa-lightbulb')}</i><i style="background:var(--amber);color:#241A00;">${svgIcon('fa-user')}</i></span>AI first, you for unsure fields</div>
      </div>
      <div class="s20-row s20-lane reveal">
        <div class="s20-gen"><span class="s20-l" style="background:var(--teal);color:var(--ink);">C</span><div><b>Agent + bots</b><span class="term">uses: Manages the bots</span><span class="s20-score" hidden></span></div></div>
        <div class="s20-flow">
          <div class="s20-band"><b>${svgIcon('fa-bolt')} Agent watches every run</b><span>Timeout → retry</span><span>Invoice number missing → ask a person</span><span>Already paid → skip</span></div>
          <span class="s20-st">Read inbox</span><i>→</i>
          <span class="s20-st">Get invoice fields</span><i>→</i>
          <span class="s20-st">Update Excel</span><i>→</i>
          <span class="s20-st">Send summary</span>
        </div>
        <div class="s20-who"><span class="s20-ics"><i style="background:var(--teal);color:var(--ink);">${svgIcon('fa-bolt')}</i><i style="background:var(--amber);color:#241A00;">${svgIcon('fa-user')}</i></span>The agent; you only for risky ones</div>
      </div>
    </div>
    <p class="takeaway reveal"><b>The bot does the clicks in all three.</b> AI moves the judgment closer to the work, but a person still owns the risky calls.</p>
  </div>`},

{ theme:'light', label:'Works today vs hype', interactive:'quiz', notes:`- Optional game (3–5 min): click "Real or hype? Quiz the room" (top right). The columns go blank and one statement appears at a time. The room shouts or raises hands, you click the room's answer, and the item drops into its real column. Click "End" at any time to bring back the evidence row. The order is random each time.
- Read it like a traffic light: green = use it now, amber = use it with a person watching, red = do not believe it.
- Which column each item sits in is my judgment from industry work, not a measurement. Ask the room: "Where would you put an AI that writes your whole lab report?"
- 17%: Gartner 2026 CIO survey; another 42% expect to deploy agents within 12 months. Gartner's Hype Cycle for Agentic AI (Apr 2026) puts it at the "Peak of Inflated Expectations" and says fully autonomous agents are not ready for most enterprise uses.
- 40%: McKinsey, The State of AI 2026 (25 Aug 2026), respondents at large organizations (revenue over $1B); up from 27% a year earlier. Smaller organizations stayed flat at 22%.
- 12% to ~66%: Stanford AI Index 2026, real computer tasks (the OSWorld test) during 2025. Computer-science students score ~72%. Agents still fail about 1 in 3 attempts on structured tests.
- Gartner forecast (25 Jun 2025): over 40% of agentic AI projects will be cancelled by end of 2027 (rising costs, unclear value, weak risk controls). Say clearly that this is a forecast.
- For balance, a company-reported win: Banco Azteca cut dispute handling from 97 hours to 4.8 hours per case with agentic automation (UiPath, Sep 2026).`, html:`
  <div class="slide-inner s23">
    <style>
      .s23 h2.say{max-width:52ch;}
      .s23 .s23-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:4px;}
      .s23 .s23-col{border-radius:12px; padding:12px 16px 14px; background:var(--mist); border:1px solid var(--line); border-top:6px solid var(--line);}
      .s23 .s23-go{border-top-color:#15803D;}
      .s23 .s23-watch{border-top-color:var(--amber);}
      .s23 .s23-hype{border-top-color:#B91C1C; background:#E8ECF1;}
      .s23 .s23-h{display:flex; align-items:center; gap:9px; font:700 clamp(16px,1.4vw,18px)/1.2 'Sora',system-ui,sans-serif; margin:0 0 9px;}
      .s23 .s23-h svg{font-size:20px;}
      .s23 .s23-go .s23-h{color:#15803D;}
      .s23 .s23-watch .s23-h{color:#8F5B00;}
      .s23 .s23-hype .s23-h{color:#B91C1C;}
      .s23 .s23-col ul{list-style:none; margin:0; padding:0; display:grid; gap:6px;}
      .s23 .s23-col li{position:relative; padding-left:22px; font-size:clamp(15px,1.3vw,16.5px); line-height:1.35;}
      .s23 .s23-col li::before{position:absolute; left:0; top:0; font-weight:800;}
      .s23 .s23-go li::before{content:"✓"; color:#15803D;}
      .s23 .s23-watch li::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--amber); top:.42em; left:2px;}
      .s23 .s23-hype li::before{content:"✗"; color:#B91C1C;}
      .s23 .s23-hype li span{color:#3B4658; text-decoration:line-through; text-decoration-color:rgba(185,28,28,.6); text-decoration-thickness:1.5px;}
      .s23 .s23-ev{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:12px;}
      .s23 .s23-stat{display:flex; flex-direction:column; background:#fff; border:1px solid var(--line); border-left:5px solid var(--teal-deep); border-radius:10px; padding:8px 14px 9px;}
      .s23 .s23-num{display:block; font:800 clamp(22px,2.3vw,29px)/1.1 'Sora',system-ui,sans-serif; color:var(--teal-deep);}
      .s23 .s23-stat p{margin:3px 0 0; font-size:clamp(14px,1.15vw,15px); line-height:1.35;}

      /* "Real or hype?" quiz: the items hide, the card takes the place of the evidence row */

      .s23 .s23-col li.q-hide{opacity:.1; filter:blur(4px);}
      .s23 .s23-col li.q-flash{animation:s23-flash 1.2s ease 1; border-radius:6px;}
      .s23.s23-quizzing .s23-ev{display:none;}
      .s23 .s23-quiz{margin-top:12px; background:var(--ink); color:#fff; border-radius:14px; padding:12px 16px; display:grid; gap:10px; box-shadow:0 14px 30px -16px rgba(15,18,34,.7);}
      .s23 .s23-quiz[hidden]{display:none;}

      .s23 .s23-qn{font:700 13px 'JetBrains Mono',monospace; color:#5EEAD4; text-transform:uppercase; letter-spacing:.05em;}
      .s23 .s23-qs{font:700 clamp(17px,1.6vw,20px)/1.3 'Sora',system-ui,sans-serif;}
      .s23 .s23-qfb{margin-left:auto; font-weight:700; font-size:16px;}
      .s23 .s23-qfb.ok{color:#4ADE80;}
      .s23 .s23-qfb.bad{color:#F87171;}

      .s23 .s23-qbtns [hidden]{display:none;}
      .s23 .s23-v-go{background:#15803D; border-color:#15803D;}

      .s23 .s23-qbtns [data-act="end"]{margin-left:auto; border-color:rgba(255,255,255,.35); color:#fff;}
      @keyframes s23-flash{0%{background:rgba(242,177,52,.55)} 100%{background:transparent}}
      @media (prefers-reduced-motion: reduce){ :root:not(.force-motion) .s23 *{transition:none !important; animation:none !important;} }
      @media (max-width:760px){
        .s23 .s23-cols, .s23 .s23-ev{grid-template-columns:1fr;}
      }
    </style>
    <div class="play-dock"><button type="button" class="play-btn" data-act="quiz">🎯 Real or hype? Quiz the room</button></div>
    <p class="eyebrow reveal">The honest state of AI agents · October 2026</p>
    <h2 class="heading say reveal">Today, agents are reliable for narrow jobs with a person checking. Not for running whole processes alone.</h2>
    <div class="s23-cols">
      <div class="s23-col s23-go reveal">
        <p class="s23-h">${svgIcon('fa-circle-check')} Works today</p>
        <ul>
          <li>Reading standard invoices and forms</li>
          <li>Sorting and summarizing emails</li>
          <li>Drafting text a person approves</li>
          <li>Coding help, with review</li>
        </ul>
      </div>
      <div class="s23-col s23-watch reveal">
        <p class="s23-h">${svgIcon('fa-eye')} Works with a person watching</p>
        <ul>
          <li>Agents doing multi-step tasks in one narrow area</li>

{ theme:'light', label:'Limits: a person stays in', notes:`- Take the four cards one by one. For each, ask: "Have you seen this happen?" (for example, a chatbot that invented a fact).
- Wrong: this is the next-word guesser from slide 07. In RPA, check AI output with rules (total = sum of line items) and send unsure cases to a person.
- Cost: in Microsoft Copilot Studio (Oct 2026) one AI "computer use" step costs 5 Copilot Credits, while a fixed agent flow costs 13 credits per 100 actions. That is why RPA still does the fixed, high-volume steps. Normal robots are licensed too, not free.
- Security: OWASP Top 10 for LLM Applications (2025) ranks prompt injection as risk #1: hidden instructions in an email, web page or file that trick the AI. The 74% and 13% come from a Gartner survey of 360 IT application leaders (30 Sep 2025).
- Explain: a manager or auditor must know why a payment was approved, and "the AI said so" is not an answer. That is why the lab's watcher writes a reason for every decision.
- Gartner forecast (25 Jun 2025): over 40% of agentic AI projects will be cancelled by end of 2027, because of rising costs, unclear value and weak risk controls. It is a forecast, not a fact yet.
- Ask the room: "Which of these four would worry a bank the most?"`, html:`

{ theme:'light', label:'What companies want now', notes:`- Say: "Let's be practical. You are in your final year. What are companies hiring for right now, and how do you get noticed?"
- Left side: what they look for in 2026. The first row matters most: everyone can make an AI write code. Companies hire the person who can check it, run it and fix it. That is exactly what you practise today with Copilot and Kiro.
- Python plus one automation platform (UiPath for most of you, after BCG701) beats ten half-known tools. Cloud and API basics: keep keys out of GitHub, handle limits, run a job on a schedule.
- "Know when NOT to use AI" is a real interview signal: rules for fixed steps, AI for judgment, a person for risky calls (the whole talk in one line).
- Explain simply: a README a stranger can follow, a 2-minute demo, and one honest story about something that broke.
- Right side: the five-step plan. Point at step 1: "Your lab project today can be on GitHub tonight."
- Certificates: one AI certificate is enough; pick the cloud or tool you like. Examples: AWS Certified AI Practitioner, Microsoft Azure AI Fundamentals (its exam is AI-901 since AI-900 retired in June 2026), Google AI Essentials, or UiPath Agentic Automation Associate for the automation path. Many have free learning paths; check each provider's student offers, as exam names and prices change. One certificate plus one working project beats five certificates and no project.
- Read the resume formula and the example. Ask: "Write your own line now, using what you build this afternoon."
- Evidence: India Skills Report 2026 (Wheebox, CII, AICTE): computer-science and IT graduates are the most employable (80% and 78%), and AI, data analytics, cloud and cybersecurity are the most in-demand skills. WEF Future of Jobs Report 2025: AI and big data is the fastest-growing skill to 2030.
- Ask the room: "Which of the five steps can you finish this week?" Close with: "Companies hire proof, not promises: one working project, one certificate, one clear story."`, html:`

// ---- 30-watcher.js ----
{ theme:'light', label:'Your watcher agent', notes:`- Say: "This is the same loop as slide 12, used for one small job: reading the robot's job log and choosing the next step for each job."
- LOOK: the watcher reads sample_orchestrator_log.json, a saved Orchestrator job log. THINK: what kind of result is it? ACT: it prints RETRY, ESCALATE or STOP. CHECK: it writes the reason and goes to the next job.
- Read the terminal: J-1001 had a short glitch, so retry. J-1003 has bad data (no invoice number), so a person must fix it. J-1004 finished fine, so stop: nothing to do.
- Be honest: the THINK step uses clear written rules, not an LLM. Rules are the right tool when the cases are known. Use an LLM only for errors the rules do not know, and still ask a person when unsure.
- Files in the repo: watcher_agent.py, kiro-specs/watcher-agent.spec.md (the plain-English description you write in Kiro) and sample_orchestrator_log.json.
- Ask the room: "J-1003 has bad data. Why is retrying it a waste of time?"`, html:`

/* ============================= ENGINE ============================= */
const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = `slide slide--${s.theme}`;
  el.dataset.index = i;
  el.innerHTML = s.html;
  deck.appendChild(el);
});
const slideEls = Array.from(document.querySelectorAll('.slide'));
let current = 0;
const total = slideEls.length;
document.getElementById('counterTotal').textContent = total;

function layout(){
  slideEls.forEach((el,i)=>{
    const offset = i - current;
    el.style.zIndex = offset===0 ? 10 : 4;
    if(Math.abs(offset) > 1){
      el.style.opacity = 0;
      el.style.pointerEvents='none';
      el.style.transform = `translateX(${offset>0?100:-100}%)`;
      el.classList.remove('in-view');
      return;
    }
    if(offset===0){
      el.style.opacity = 1;
      el.style.pointerEvents='auto';
      el.style.transform = 'translateX(0) translateZ(0) rotateY(0deg) scale(1)';
    } else {
      el.style.opacity = 0;
      el.style.pointerEvents='none';
      const ry = offset<0 ? 42 : -42;
      el.style.transform = `translateX(${offset*100}%) translateZ(-320px) rotateY(${ry}deg) scale(.86)`;
    }
  });
  // trigger reveal animation on active slide
  slideEls.forEach(el=> el.classList.remove('in-view'));
  const activeEl = slideEls[current];
  const items = activeEl.querySelectorAll('.reveal');
  items.forEach((it,idx)=> it.style.transitionDelay = (idx*55)+'ms');
  requestAnimationFrame(()=> requestAnimationFrame(()=> activeEl.classList.add('in-view')));

  // chrome theming
  const isLight = slides[current].theme === 'light';
  document.getElementById('counterNum').textContent = String(current+1).padStart(2,'0');
  document.getElementById('counterLabel').textContent = slides[current].label;
  document.getElementById('progress-bar').style.width = ((current+1)/total*100)+'%';
  ['prevBtn','nextBtn','fsBtn','notesBtn'].forEach(id=>{
    document.getElementById(id).classList.toggle('is-light', isLight);
  });
  document.getElementById('counter').classList.toggle('is-light', isLight);
  renderNotes();

  document.querySelectorAll('video').forEach(v=>{ if(!activeEl.contains(v)) v.pause(); });
  wireInteractive();
  const demo = slides[current].demo;
  if(demo==='code') startTypingDemo('termBody', typingScript);
  else if(demo==='rpa') startRpaVisual();
  else { stopTypingDemo(); stopRpaVisual(); }
}

function goTo(i){
  current = Math.max(0, Math.min(total-1, i));
  layout();
}
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current+1));
document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current-1));
window.addEventListener('keydown', (e)=>{
  if(!overview.hidden){ // while the overview is open, keys belong to it
    if(['Escape','o','O'].includes(e.key)){ e.preventDefault(); overview.hidden = true; }
    return;
  }
  if(e.target.closest && e.target.closest('video')) return; // let Space/arrows control a focused video
  if(e.target.matches && e.target.matches('input, textarea')) return; // typing a word must not change slides
  if(e.key===' ' && e.target.closest && e.target.closest('.slide button')) return; // Space presses a focused slide button
  if(e.key==='o' || e.key==='O') toggleOverview();
  if(e.key==='t' || e.key==='T') toggleTimer(e.shiftKey);
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); goTo(current+1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); goTo(current-1); }
  if(e.key==='f' || e.key==='F') toggleFullscreen();
  if(e.key==='n' || e.key==='N') toggleNotes();
  if(e.key==='Home') goTo(0);
  if(e.key==='End') goTo(total-1);
});
// touch swipe
let touchX=null;
window.addEventListener('touchstart', e=> touchX = e.touches[0].clientX);
window.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 50) goTo(current + (dx<0?1:-1));
  touchX=null;
});

function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); }
  else { document.exitFullscreen?.(); }
}
document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
